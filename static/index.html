<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>dcr-transcribe</title>
<style>
:root{
  --bg:#0f1115;--bg2:#161922;--fg:#e8eaed;--muted:#888c95;--border:#1f222a;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bot:env(safe-area-inset-bottom,0);
  --safe-l:env(safe-area-inset-left,0);
  --safe-r:env(safe-area-inset-right,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--fg);
  /* 上に行を足したときの位置補正は自前で行う(ブラウザの補正と二重にならないように) */
  overflow-anchor:none;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
/* スマホ: 上部に固定ヘッダ(タブ + ライブ)。PC: 左サイドバー(下の @media) */
#side{
  position:sticky;top:0;z-index:10;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:calc(8px + var(--safe-top)) 12px 6px;
}
.tr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tr h1{font-size:14px;margin:0;font-weight:600;flex:1}
.s{font-size:11px;padding:3px 9px;border-radius:10px;background:#2a2d34;color:var(--muted);white-space:nowrap}
.s.on{background:#1a4a2a;color:#9f9}
.s.off{background:#4a1a1a;color:#f99}
.s.reco{background:#4a3a1a;color:#fc6}
.s.chain{background:#1a3a4a;color:#8cf;cursor:pointer}
button.s{font:inherit;font-size:11px;border:none;cursor:pointer}
/* 接続の状態: 緑=正常 黄=品質低下 赤=止まっている 灰=不明 */
.hp{position:absolute;right:12px;top:calc(40px + var(--safe-top));z-index:20;width:min(92vw,360px);
  background:#1b1e26;border:1px solid #2f3440;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px}
.hp[hidden]{display:none}
.hp .dg{margin:0 0 8px;line-height:1.5}
.hp .row{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-top:1px solid #262a33}
.hp .row b{flex-shrink:0;width:6.5em;font-weight:600}
.hp .row span{color:var(--muted);font-variant-numeric:tabular-nums;word-break:break-word}
.hp .note{margin:8px 0 0;color:var(--muted);font-size:11px}
.hp .lo{margin-top:10px;width:100%;min-height:34px;border:1px solid #5a3a3a;border-radius:8px;background:transparent;color:#f99;font:inherit;font-size:12px;cursor:pointer}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#5a5f6a}
.d.g{background:#3ecf6e}.d.y{background:#f2c14e}.d.r{background:#ff5a5a}
@media(min-width:900px){.hp{position:fixed;left:16px;right:auto;top:52px}}
.shb{
  font:inherit;font-size:11px;padding:3px 10px;border-radius:10px;border:1px solid #3a4150;
  background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap;
}
/* 共有の窓(スマホは下から、PC は中央) */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{
  background:var(--bg2);width:100%;max-width:420px;border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + var(--safe-bot));text-align:center;
}
.sheet .hd{display:flex;align-items:center;font-weight:600;margin-bottom:12px}
.sheet .hd span{flex:1;text-align:left}
.sheet .x{border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.sheet img{width:min(64vw,240px);aspect-ratio:1;background:#fff;padding:8px;border-radius:8px;image-rendering:pixelated}
.sheet .url{margin:10px 0 4px;font-size:12px;word-break:break-all;color:var(--muted);user-select:all}
.sheet .warn{margin:0 0 12px;font-size:11px;color:#fc6}
.sheet .btns{display:flex;gap:8px}
.sheet .btns button{flex:1;min-height:40px;border:none;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:#2a4060;color:#fff}
.sheet .btns button[hidden]{display:none}
.sheet .msg{margin:10px 0 0;font-size:12px;color:#9f9;min-height:1.5em}
@media(min-width:900px){
  .modal{align-items:center}
  .sheet{border-radius:16px}
}
.s.chain[hidden]{display:none}
.chips{
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:0 -12px;padding:0 12px 4px;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;font-size:12px;padding:6px 12px;border-radius:14px;
  border:1px solid transparent;cursor:pointer;user-select:none;
  background:#2a2d34;color:var(--muted);
  min-height:30px;display:flex;align-items:center;
}
.chip.on{background:var(--ch-bg);color:var(--ch-fg);border-color:var(--ch-fg)}
/* チャンネルタブ(表示するチャンネルの切り替え + 受信状態) */
.tabs{
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:0 -12px 2px;padding:0 12px 6px;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;position:relative;display:flex;flex-direction:column;gap:3px;
  min-width:72px;padding:6px 10px 7px;border-radius:10px;border:1px solid transparent;
  background:#22252d;color:var(--muted);font:inherit;font-size:12px;text-align:left;cursor:pointer;
}
.tab.sel{background:var(--ch-bg,#2a3550);color:var(--ch-fg,#cfe0ff);border-color:var(--ch-fg,#6c8fd8)}
.tab .tn{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#444a55;flex-shrink:0}
.tab.rx .dot{background:#ff4d4d;box-shadow:0 0 0 3px rgba(255,77,77,.25)}
.tab .meter{height:3px;border-radius:2px;background:#2f333c;overflow:hidden}
.tab .meter i{display:block;height:100%;width:0;background:var(--ch-fg,#8aa);transition:width .25s}
.tab.rx .meter i{background:#ff6b6b}
/* 状態の文字(受信中 n秒 / 最終受信 / 待機中)は長さが変わるので、常に 1 行分の高さで折り返さない(レイアウトを動かさない) */
.tab .tst{display:none;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em;line-height:1.5em}
.tab .tx{margin-left:auto;font-size:10px;font-weight:600;padding:0 5px;border-radius:6px;background:#333842;color:#778}
.tab .tx.on{background:#1a4a2a;color:#9f9}
.tab .tx.err{background:#4a1a1a;color:#f99}
.tab.unknown .dot,.tab.unknown .meter i{opacity:.3}
@media(prefers-reduced-motion:no-preference){
  .tab.rx .dot{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,77,77,0)}}
}
.live{display:flex;align-items:center;gap:8px;margin-top:4px}
.live[hidden]{display:none}
.live .lbl{font-size:11px;color:var(--muted);flex-shrink:0}
.live .chips{flex:1;margin:0;padding:0 0 4px}
.lp{
  /* 表示(▶ 聞く / ■ 停止 0.3秒 / 接続中…)が変わっても幅を変えない */
  flex-shrink:0;width:7.5em;white-space:nowrap;font-variant-numeric:tabular-nums;
  border:none;border-radius:14px;padding:6px 8px;min-height:30px;
  background:#2a4060;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
}
.lp.on{background:#a33;}
.lp.wait{background:#665;}
#older{
  padding:10px;text-align:center;font-size:13px;color:var(--muted);
  cursor:pointer;border-top:1px solid var(--border);user-select:none;
  display:none;
}
#older.show{display:block}
#older:active{background:var(--bg2)}
#log{padding:0}
#older{margin-bottom:calc(80px + var(--safe-bot))}
#empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.r.now{box-shadow:inset 3px 0 0 var(--ch-fg)}
/* 同じ録音区間の行が続くときは 1 かたまりに見せる(▶ は一番上の行だけ) */
.r.joined{border-bottom-color:transparent;padding-bottom:2px}
.r.cont{padding-top:2px}
.r.cont .name{visibility:hidden}
.r{padding:9px 12px;border-bottom:1px solid var(--border);background:var(--ch-bg)}
.r .meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
.r .name{color:var(--ch-fg);font-weight:600}
.r .ts{font-variant-numeric:tabular-nums}
.r .x{font-size:15px;word-break:break-word}
.p{opacity:.55;font-style:italic}
.pl{
  margin-left:auto;flex-shrink:0;border:1px solid var(--ch-fg);background:transparent;color:var(--ch-fg);
  border-radius:12px;font-size:11px;padding:1px 9px;min-width:56px;cursor:pointer;
  font-family:inherit;font-variant-numeric:tabular-nums;font-style:normal;
}
.pl:disabled{opacity:.4;cursor:default}
.pl.on{background:var(--ch-fg);color:var(--ch-bg)}
.sg .x{color:var(--muted);font-size:13px}
.gap{
  padding:6px 12px;background:#2a2030;color:#fc6;font-size:11px;text-align:center;
  border-bottom:1px solid var(--border);
}
.c0{--ch-bg:#14233a;--ch-fg:#6cb6ff}
.c1{--ch-bg:#143a1c;--ch-fg:#6cf99a}
.c2{--ch-bg:#3a2e14;--ch-fg:#ffd86c}
.c3{--ch-bg:#3a1820;--ch-fg:#ff90b0}
.c4{--ch-bg:#2a1838;--ch-fg:#cc88ff}
.c5{--ch-bg:#3a2c14;--ch-fg:#ffb060}
.c6{--ch-bg:#143a3a;--ch-fg:#6cffe0}
.c7{--ch-bg:#2a2a2a;--ch-fg:#c0c0c0}
.c8{--ch-bg:#3a2614;--ch-fg:#ff9c70}
.c9{--ch-bg:#143a30;--ch-fg:#6cffaa}
.fab{
  position:fixed;left:50%;bottom:calc(20px + var(--safe-bot));
  transform:translateX(-50%);
  background:#2a4060;color:#fff;border:none;
  padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;display:none;z-index:5;
  font-family:inherit;
}
.fab.show{display:block}
@media(prefers-reduced-motion:no-preference){
  .r{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}}
}
/* PC: 左にチャンネルのカード、右に読みやすい幅のタイムライン */
@media(min-width:900px){
  body{font-size:16px}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr)}
  #side{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    border-bottom:none;border-right:1px solid var(--border);padding:16px;
  }
  .tr h1{font-size:16px}
  .tabs{flex-direction:column;overflow:visible;margin:8px 0 14px;padding:0;gap:8px}
  .tab{min-width:0;padding:10px 12px;font-size:13px;gap:6px}
  .tab .meter{height:5px}
  .tab .tst{display:block;color:var(--muted)}
  .tab.rx .tst{color:#ff8a8a}
  .tab:hover{border-color:#3a3f4a}
  .live{flex-wrap:wrap;margin-top:0}
  .live .lbl{width:100%;font-size:12px}
  .live .chips{flex-wrap:wrap;overflow:visible;flex:1 1 100%}
  .lp{width:100%;min-height:36px;font-size:13px}
  main{max-width:880px;width:100%;justify-self:center}
  .r{padding:11px 20px}
  .r .x{font-size:16px;line-height:1.6}
  .r:hover{filter:brightness(1.12)}
  .fab{left:calc(300px + (100vw - 300px)/2)}
  .keys{display:block}
}
.keys{display:none;margin-top:14px;font-size:11px;color:var(--muted);line-height:1.7}
/* 対応していないブラウザの案内。最初から出しておき、判定の script が対応を確かめたら隠す
   (CSP や古い JavaScript で script が動かないブラウザでも案内が残るように) */
.unsup{max-width:520px;margin:15vh auto 0;padding:24px 20px;background:var(--bg2);border-radius:14px;text-align:center}
.unsup h1{font-size:16px;margin:0 0 10px}
.unsup p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 8px}
html.ok .unsup{display:none}
html:not(.ok) .app,html:not(.ok) .fab{display:none}
.keys kbd{background:#2a2d34;border-radius:4px;padding:0 5px;font-family:inherit}
/* チャンネル別の交信一覧。各列で過去を読める。 */
main{min-width:0}
.history-bar{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border);background:var(--bg2)}
.history-bar button{border:1px solid #404858;border-radius:8px;background:#252d3a;color:var(--fg);padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}
.history-bar button:disabled{opacity:.55;cursor:default}
#history-note{flex:1;color:var(--muted);font-size:11px}
#older,#older.show{display:block;margin:0;padding:8px 12px}
#log{display:flex;gap:1px;overflow-x:auto;background:var(--border);height:calc(100dvh - 225px);min-height:300px}
.channel{flex:1 0 280px;min-width:0;background:var(--bg);display:flex;flex-direction:column}
.channel[hidden]{display:none}
.channel h2{margin:0;padding:12px;font-size:14px;color:var(--ch-fg);background:var(--ch-bg);border-bottom:1px solid var(--border)}
.channel-feed{overflow-y:auto;flex:1;min-height:0;overflow-anchor:none;scrollbar-gutter:stable}
.channel-feed:empty:after{content:"このチャンネルの交信はまだありません";display:block;padding:24px 12px;color:var(--muted);font-size:12px}
.r{animation:none}
.tr{flex-wrap:wrap}.tr h1{flex-basis:100%}
@media(min-width:900px){main{max-width:none}.app{grid-template-columns:240px minmax(0,1fr)}#log{height:calc(100dvh - 64px)}.fab{left:calc(240px + (100vw - 240px)/2)}}
@media(max-width:899px){#log{overflow-x:hidden}.channel{flex:1 0 100%;width:100%}.channel.call h2{display:none}.r .x{overflow-wrap:anywhere}}
@media(max-width:599px){#history-note{display:none}.history-bar{justify-content:space-between}}
</style>
</head>
<body>
<div class="unsup" id="unsup" role="alert">
  <h1>このブラウザには対応していません</h1>
  <p>最新の Safari・Chrome・Edge・Firefox で開いてください。</p>
  <p>JavaScript が無効になっている場合は有効にしてください。</p>
</div>
<script>
(function(){
  // 閲覧画面が使う機能がそろっているか(足りなければ案内を出したまま、本体を動かさない)
  var w=window,ok=false;
  try{
    ok=!!(w.EventSource&&w.fetch&&w.Promise&&w.URLSearchParams&&w.Set&&Array.from&&w.AbortController&&
      w.Uint8Array&&w.Float32Array&&w.performance&&performance.now&&Element.prototype.closest&&
      document.documentElement.classList&&("dataset" in document.documentElement)&&
      w.CSS&&CSS.supports&&CSS.supports("display","grid")&&CSS.supports("position","sticky"));
  }catch(_){ok=false}
  if(ok)document.documentElement.className+=" ok";
  w.__dcrOk=ok;
})();
</script>
<div class="app">
<aside id="side">
  <div class="tr">
    <h1>dcr-transcribe</h1>
    <span class="s chain" id="chain" hidden></span>
    <button class="shb" id="reload" title="再読み込み" aria-label="再読み込み">↻</button>
    <button class="shb" id="share" title="閲覧画面のリンクを共有">共有</button>
    <button class="s" id="s" aria-haspopup="dialog" aria-controls="hp">● 接続中…</button>
  </div>
  <div class="hp" id="hp" role="dialog" aria-label="接続の状態" hidden>
    <p class="dg" id="hpdg"></p>
    <div id="hprows"></div>
    <p class="note">端末・サーバは 30 秒ごとに測っています。遅れは各機械の時計のずれを補正した値です。タップで閉じる</p>
    <button class="lo" id="logout">この端末からログアウト</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="live" id="live" hidden>
    <span class="lbl">ライブ</span>
    <div class="chips" id="lchips"></div>
    <button class="lp" id="lplay">▶ 聞く</button>
  </div>
  <div class="keys"><kbd>0</kbd> すべて <kbd>1</kbd>〜<kbd>9</kbd> チャンネル <kbd>L</kbd> ライブ <kbd>Esc</kbd> 再生停止</div>
</aside>
<main>
  <div class="history-bar"><button id="older" type="button">↑ 過去の交信を読み込む</button><span id="history-note">古い交信が上・新着が下</span><button id="latest" type="button">最新へ ↓</button></div>
  <div id="log"></div>
  <div id="empty" hidden>まだ受信していません</div>
</main>
</div>
<button class="fab" id="fab">↓ 最新へ</button>
<div class="modal" id="shm" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="閲覧画面を共有">
    <div class="hd"><span>閲覧画面を共有</span><button class="x" id="shx" aria-label="閉じる">✕</button></div>
    <img id="shqr" alt="ログイン用の QR コード">
    <div class="url" id="shurl"></div>
    <p class="warn">このリンクを知っている人は閲覧できます</p>
    <div class="btns"><button id="shnative">共有…</button><button id="shcopy">コピー</button></div>
    <p class="msg" id="shmsg"></p>
  </div>
</div>
<script>
(function(){
if(!window.__dcrOk)return;
var liveBar=document.getElementById("live"),lchips=document.getElementById("lchips"),lplay=document.getElementById("lplay");
var log=document.getElementById("log"),stat=document.getElementById("s"),tabsBox=document.getElementById("tabs"),fab=document.getElementById("fab"),older=document.getElementById("older"),emptyEl=document.getElementById("empty");
var p=new URLSearchParams(location.search);
var wantP=p.get("p")==="1";
var TAB="dcr-tab";
// 表示するチャンネル("all" かチャンネル ID)
// localStorage は使えない環境がある(保存を止めている・一部のプライベートブラウズ)。使えなくても動かす
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
var view=lsGet(TAB)||"all";
var LIVE="dcr-live";
var liveSel=new Set((function(){try{return JSON.parse(lsGet(LIVE)||"[]")}catch(_){return[]}})());

// 状態
// 行は古いものが上。チャンネルごとに時刻の昇順で挿入する
var es=null;
var anchorMs=0;
var names={};
var feeds={},historyEnd=false,scrollQueued=false;
var mobileLayout=window.matchMedia("(max-width: 899px)");
var mixedLayout=mobileLayout.matches&&view==="all";
var stick=true;            // 各列の最下部(最新)に追従するか
var newCount=0;
var firstShownId=0;        // DOM 上で最も古いイベント ID(0 = まだ何もない)
var lastSeenId=0;          // 受信済みの最大 ID
var loadingOlder=false;
var hiddenAt=0;
var wasStickyOnHide=true;
var FAST_THRESHOLD_MS=30000; // この時間以上 hidden だったらファストロード
var FAST_HEAD=20;            // ファストロード時に取得する件数
// 接続の状態(色分けと、どこに問題があるかの判定に使う)
var H={
  sse:"init",       // サーバとの SSE: init / open / reco(再接続中) / off(閉じた)
  beatAt:0,         // 最後に心拍(event: hb)を受け取った時刻(この端末の時計)
  beat:null,        // 最後の心拍 {ms: サーバの時刻, so: サーバの時計のずれ}
  edge:null,        // Cloudflare エッジまで {ok, rtt} / {na:true}(Cloudflare を通っていない)
  origin:null,      // サーバ(/healthz)まで {ok, rtt}
  devOff:null,      // この端末の時計 − 正しい時刻(ms)
  up:null,          // 中継サーバのとき: 会場との接続 {on, t, rtt, q, k, vo, ld}
  down:null,        // サーバ → この端末の片道(ms、心拍から。時計のずれを補正、なめらかにした値)
  lat:null          // 直近の文字起こしの遅れ {aws, del, at, exact}
};
var segs={};               // 録音区間 id -> {c,t,d}
var maxSegId=0;
var playingId=0;
var chainEl=document.getElementById("chain");

function pad(n){return n<10?"0"+n:""+n}
function msOf(s){return anchorMs+s*1000}
function fmtMs(ms){if(!ms)return"";var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}

function ago(ms){
  var s=Math.floor(ms/1000);

  if(s<3600)return Math.floor(s/60)+"分";

}

// ── 接続の状態 ──
// 端末 ⇄ Cloudflare エッジ(/cdn-cgi/trace はエッジ自身が返す)と、端末 ⇄ サーバ(/healthz)を測り比べて、
// 止まっているのが端末側か、サーバ側か、会場側かを判定する
var BEAT_STALE_MS=35000;   // 心拍(10 秒ごと)がこれだけ来なければ配信が止まっている
var PROBE_MS=30000;
var CLOCK_WARN=500,CLOCK_BAD=2000;
function fmtOff(ms){var s=(ms/1000).toFixed(1);return(ms>=0?"+":"")+s+"秒"}
function fmtRtt(ms){return Math.round(ms)+"ms"}
function fmtSec(ms){ms=Math.max(0,ms);return(ms/1000).toFixed(ms<10000?2:1)+"秒"}
// 会場の時計 − 正しい時刻(ms)。中継サーバ経由なら 会場−中継 + 中継−正しい、直結ならサーバ = 会場
function venueClockErr(){
  var so=H.beat&&H.beat.so!=null?H.beat.so:null;
  if(H.up)return H.up.vo!=null&&so!=null?H.up.vo+so:null;
  return so;
}
// 文字起こしの遅れ: 話し終えて(e)→ 会場が AWS から受け取り(r)→ この端末に届くまで。
// AWS の分は会場の時計どうしの差なので時計のずれに左右されない。配信の分は 会場・端末の時計のずれを補正する
function noteTranscriptLatency(e){
  if(!e.r||e.p)return;
  var ve=venueClockErr(),exact=ve!=null&&H.devOff!=null&&!(H.edge&&H.edge.na);
  var del=(Date.now()-(exact?H.devOff:0))-(e.r-(exact?ve:0));
  // 接続した直後にまとめて届いた古いものは数えない
  if(del>60000)return;
  var aws=e.e!=null?e.r-(anchorMs+e.e*1000):null;
  if(aws!=null&&(aws<-1000||aws>120000))aws=null;
  H.lat={aws:aws,del:Math.max(0,del),at:Date.now(),exact:exact};
}
// ライブの遅れの内訳(ms)。聞いていなければ null
function liveLatency(){
  if(mode!=="live")return null;
  var out=0;
  if(liveEngine==="ll"&&LL.ctx)out=((LL.ctx.outputLatency||0)+(LL.ctx.baseLatency||0))*1000;
  return{up:H.up&&H.up.ld!=null?H.up.ld:null,down:H.down,play:liveLag*1000+out};
}
function rows(){
  var out=[],now=Date.now();
  // 端末の回線
  var e=H.edge,dev;
  if(navigator.onLine===false)dev=["r","オフライン"];
  else if(!e)dev=["u","測定中"];
  else if(e.na)dev=["u","測定なし(Cloudflare を通っていない)"];
  else if(!e.ok)dev=["r","Cloudflare に届きません"];
  else dev=[e.rtt>1500?"y":"g",fmtRtt(e.rtt)+(e.rtt>1500?"(遅い)":"")];
  out.push({k:"端末の回線",l:dev[0],t:dev[1]});
  // サーバ
  var o=H.origin,stale=H.sse==="open"&&H.beatAt&&now-H.beatAt>BEAT_STALE_MS,srv;
  if(H.sse==="open"&&!stale){
    if(o&&!o.ok)srv=["y","配信は届いていますが応答が遅れています"];
    else if(o&&o.rtt>2000)srv=["y",fmtRtt(o.rtt)+"(遅い)"];
    else srv=["g",o?fmtRtt(o.rtt):"接続中"];
  }else if(H.sse==="init")srv=["u","接続中…"];
  else if(o&&o.ok)srv=["y",stale?"配信が止まっています(つなぎ直します)":"再接続中…"];
  else if(e&&e.ok)srv=["r","応答しません"];
  else if(e&&e.na&&o&&!o.ok)srv=["r","届きません"];
  else srv=["u",H.sse==="reco"?"再接続中…":"確認できません"];
  out.push({k:"サーバ",l:srv[0],t:srv[1]});
  // 会場(中継サーバのときだけ)
  var u=H.up;
  if(u){
    var v;
    if(!u.on)v=["r","切断"+(u.t?" "+fmtMs(u.t)+"〜":"")];
    else{
      var bad=[];
      if(u.rtt>=800)bad.push("遅い");
      if(u.q>3||u.k>3)bad.push("未送信 文字"+u.q+" 録音"+u.k);
      v=[bad.length?"y":"g",(u.rtt!=null?fmtRtt(u.rtt):"接続中")+(bad.length?"("+bad.join("・")+")":"")];
    }
    out.push({k:"会場",l:v[0],t:v[1]});
  }
  // 文字起こし(会場 ⇄ AWS)。無音のあいだは切っているので「待機」は灰
  var err=[],on=0;
  for(var c in chs){if(chs[c].x===2)err.push(names[c]!==undefined?names[c]:"ch"+c);else if(chs[c].x===1)on++}
  out.push({k:"文字起こし",l:err.length?"r":on?"g":"u",t:err.length?"エラー("+err.join("・")+")":on?"接続中 "+on+" ch":"待機中"});
  // 時刻のずれ(端末・サーバ・会場)
  var so=H.beat&&H.beat.so!=null?H.beat.so:null,parts=[],worst=null;
  function add(name,ms){if(ms==null)return;parts.push(name+" "+fmtOff(ms));if(worst===null||Math.abs(ms)>worst)worst=Math.abs(ms)}
  add("端末",H.devOff);
  add("サーバ",so);
  if(u&&u.on&&u.vo!=null)add("会場",u.vo+(so||0));
  out.push({k:"時刻",l:worst===null?"u":worst>CLOCK_BAD?"r":worst>CLOCK_WARN?"y":"g",t:parts.length?parts.join(" / "):"測定中"});
  // 遅れ(時計のずれを補正した値。誤差は各時計の測定の往復の半分ほど)
  var L=H.lat;
  if(L&&now-L.at<10*60000){
    var tot=(L.aws||0)+L.del;
    out.push({k:"文字起こしの遅れ",l:tot>8000?"r":tot>4000?"y":"g",
      t:fmtSec(tot)+"("+(L.aws!=null?"AWS "+fmtSec(L.aws)+" + ":"")+"配信 "+fmtSec(L.del)+(L.exact?"":"、時計未補正")+")"});
  }
  var LV=liveLatency();
  if(LV){
    var known=LV.down!=null&&(LV.up!=null||!H.up);
    var sum=(LV.up||0)+(LV.down||0)+LV.play,parts2=[];
    if(H.up)parts2.push("会場→中継 "+(LV.up!=null?fmtSec(LV.up):"?"));
    parts2.push((H.up?"中継":"会場")+"→端末 "+(LV.down!=null?fmtSec(LV.down):"?"));
    parts2.push("再生待ち "+fmtSec(LV.play));
    out.push({k:"ライブの遅れ",l:!known?"u":sum>3000?"r":sum>1500?"y":"g",t:(known?"":"約 ")+fmtSec(sum)+"("+parts2.join(" + ")+")"});
  }
  return out;
}
// 一番大事な問題を 1 つ選んで、短い表示と説明にする
function diagnose(rs){
  var by={};rs.forEach(function(r){by[r.k]=r});
  var dev=by["端末の回線"],srv=by["サーバ"],ven=by["会場"],tr=by["文字起こし"],clk=by["時刻"];
  if(dev.l==="r")return["r","端末の回線","この端末からインターネットに届いていません(端末・回線側の問題)。電波や Wi-Fi を確認してください。"];
  if(srv.l==="r")return["r","サーバ停止",dev.l==="g"||dev.l==="y"
    ?"Cloudflare までは届いていますが、サーバが応答しません(サーバ側の問題)。"
    :"サーバに届きません(端末側かサーバ側かは判別できません)。"];
  if(ven&&ven.l==="r")return["r","会場と切断","会場との接続が切れています(会場側の問題)。これまでの記録と録音は見られます。"];
  if(tr.l==="r")return["r","文字起こし","会場から文字起こし(AWS)への接続でエラーが出ています。録音は続いています。"];
  if(srv.l==="u"&&H.sse!=="open")return["u","接続中…","サーバにつないでいます。"];
  var y=[dev,srv,ven,clk].filter(function(r){return r&&r.l==="y"})[0];
  if(y){
    var label={"端末の回線":"回線が遅い","サーバ":"再接続中","会場":"会場の回線","時刻":"時刻ずれ"}[y.k];
    var why={"端末の回線":"この端末の回線が遅くなっています。","サーバ":"サーバとの接続が不安定です。自動でつなぎ直します。",
      "会場":"会場の回線が遅いか、送信が溜まっています。届くまで少し遅れます。","時刻":"時計がずれています。表示される時刻がずれることがあります。"}[y.k];
    return["y",label,why];
  }
  if(clk.l==="r")return["y","時刻ずれ","時計が大きくずれています。表示される時刻がずれることがあります。"];
  return["g","正常","すべて正常です。"];
}

hp.onclick=function(){hp.hidden=true};

// 一定時間で打ち切る fetch。所要時間(ms)も返す
function timedFetch(url,ms){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var t0=performance.now(),timer=setTimeout(function(){if(ctl)ctl.abort()},ms);
  return fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    return r.text().then(function(body){clearTimeout(timer);return{r:r,body:body,rtt:performance.now()-t0}});
  },function(err){clearTimeout(timer);throw err});
}
var probing=false;
function probe(){
  if(probing||document.hidden)return;
  probing=true;
  var sent=Date.now();
  var edge=timedFetch("/cdn-cgi/trace",6000).then(function(x){
    var ts=/^ts=([\d.]+)$/m.exec(x.body);
    // Cloudflare を通っていなければ(直結・ローカル)このパスはサーバに届いて 403/404 になる
    if(!x.r.ok||!ts||!/^fl=/m.test(x.body)){H.edge={na:true};return}
    H.edge={ok:true,rtt:x.rtt};
    // エッジの時刻は往復の真ん中とみなす
    H.devOff=Math.round(sent+x.rtt/2-parseFloat(ts[1])*1000);
  },function(){H.edge={ok:false}});
  var origin=timedFetch("/healthz",8000).then(function(x){
    H.origin={ok:x.r.ok&&x.body==="ok",rtt:x.rtt};
  },function(){H.origin={ok:false}});
  Promise.all([edge,origin]).then(function(){
    probing=false;
    // Cloudflare を通らないときは、心拍の時刻で端末の時計を大まかに比べる(配信の遅れぶん誤差がある)
    if(H.edge&&H.edge.na&&H.beat&&H.beatAt)H.devOff=Math.round(H.beatAt-(H.beat.ms-(H.beat.so||0)));
    drawHealth();
  });
}

  if(H.sse==="open"&&H.beatAt&&Date.now()-H.beatAt>BEAT_STALE_MS){markStatusUnknown();H.beatAt=Date.now();connect()}
  drawHealth();

// 過去の行を挿入した分だけ位置を補正し、読んでいる交信を固定する。
function insertSorted(d,k){
  d.dataset.k=k;
  if(d.dataset.id){var duplicate=log.querySelector('[data-id="'+d.dataset.id+'"]');if(duplicate)return duplicate}
  var feed=channelFeed(+d.dataset.channel),before=null;
  for(var c=feed.firstChild;c;c=c.nextSibling){if(+c.dataset.k>k){before=c;break}}
  var previousHeight=feed.scrollHeight,previousTop=feed.scrollTop;
  var above=before&&before.offsetTop-feed.offsetTop<previousTop;
  feed.insertBefore(d,before);
  if(!stick&&above)feed.scrollTop=previousTop+feed.scrollHeight-previousHeight;
  followLatest();return d;
}

// ── 録音区間の再生 ──
function makePlay(g){
  var b=document.createElement("button");
  b.className="pl";b.dataset.g=g;
  setPlay(b);
  b.onclick=function(){togglePlay(g)};
  return b;
}
function setPlay(b){
  var g=+b.dataset.g,sg=segs[g];
  b.disabled=!sg;
  b.classList.toggle("on",g===playingId);
  // 一覧に無いのは、まだ録音中か、サーバの保持件数を超えて消えたもの
  b.textContent=!sg?(g<=maxSegId?"録音なし":"録音中"):g===playingId?"■ 停止":"▶ "+(sg.d/1000).toFixed(1)+"秒";
}
function refreshPlay(g){
  log.querySelectorAll('.pl[data-g="'+g+'"]').forEach(setPlay);
  log.querySelectorAll('.r[data-g="'+g+'"]').forEach(function(r){r.classList.toggle("now",g===playingId)});
}
// 同じ録音区間の行のうち、一番上(新しい側)の行にだけ ▶ を置き、隣り合う行をつなげて見せる
function groupSeg(g){
  var rows=log.querySelectorAll('.r[data-g="'+g+'"]');
  for(var i=0;i<rows.length;i++){
    var r=rows[i],b=r.querySelector(".pl");
    if(i===0){if(!b)r.querySelector(".meta").appendChild(makePlay(g))}
    else if(b)b.remove();
    var next=r.nextElementSibling,prev=r.previousElementSibling;
    r.classList.toggle("joined",!!next&&next.dataset.g===String(g));
    r.classList.toggle("cont",!!prev&&prev.dataset.g===String(g));
  }
  refreshPlay(g);
}
// 行を挿入したら、その行と上下の行が属するかたまりを組み直す
function regroupAround(d){
  var gs={};
  [d,d.previousElementSibling,d.nextElementSibling].forEach(function(r){if(r&&r.dataset.g)gs[r.dataset.g]=1});
  for(var g in gs)groupSeg(+g);
}

// ── 再生(録音とライブで 1 つの audio 要素を使い回す) ──
// iOS などは画面ロック中・別アプリ表示中に「新しい」audio 要素の再生を始められない。
// 同じ要素の src を切り替えて続けることで、バックグラウンドでも連続再生 → ライブへ移れるようにする。
// ロック画面・通知の操作は Media Session で出す。
var player=null,mode=null;   // mode: "clip"(録音) | "live" | null
var liveAvailable=false;
function getPlayer(){
  if(player)return player;
  player=new Audio();
  player.preload="auto";
  player.addEventListener("ended",function(){
    if(mode==="clip"&&playingId)clipEnded(playingId);
    else if(mode==="live"&&liveEngine==="audio")liveBroken();
  });
  player.addEventListener("error",function(){
    // 読み込めない録音で止まり続けないよう、失敗したら連続再生ごと止める
    if(mode==="clip"&&playingId)stopChain();
    else if(mode==="live"&&liveEngine==="audio")liveBroken();
  });
  player.addEventListener("playing",function(){if(mode==="live"&&liveEngine==="audio"){liveWaitSince=0;catchUpLive();liveUi("on")}});
  player.addEventListener("waiting",function(){if(mode==="live"&&liveEngine==="audio"){if(!liveWaitSince)liveWaitSince=Date.now();liveUi("wait")}});
  return player;
}
function stopPlayer(){
  mode=null;
  if(player){player.pause();player.removeAttribute("src");player.load()}
  updateMediaSession();
}

// ── ライブ再生(選んだチャンネルをサーバでミックスした AAC ストリーム) ──
// 再生エンジンは 2 つ:
//   "ll"   : 低遅延。fetch で ADTS を受け取り WebCodecs でデコード、Web Audio で再生時刻を自分で管理する。
//            溜める量(jitter バッファ)を 0.15〜1 秒で回線に合わせて自動調整する
//   "audio": <audio> に任せる。WebCodecs 非対応のブラウザと、画面が隠れている間(バックグラウンド再生)に使う。
//            Chrome は再生を続けるのに約 2.3 秒溜めるので遅延は大きい。溜まりすぎたら速く再生・飛ばす:
//            3 秒超: 少し速く / 5 秒超: 今の音まで飛ぶ。接続直後のサーバの無音(プリフィル)も飛ばす
// どちらも 10 秒以上音が届かなければつなぎ直す
var liveWanted=false,liveRetry=0,liveWaitSince=0,liveLag=0,liveEngine=null;
var LIVE_FAST_LAG=3,LIVE_JUMP_LAG=5,LIVE_STALL_MS=10000;
function liveUi(state){
  lplay.className="lp"+(state==="on"?" on":state==="wait"?" wait":"");
  var lag=liveEngine==="ll"||liveLag>LIVE_FAST_LAG?" "+liveLag.toFixed(1)+"秒":"";
  lplay.textContent=state==="on"?"■ 停止"+lag:state==="wait"?"接続中…":"▶ 聞く";
  lplay.title=lag?"遅延"+lag:"";
}
// "audio" エンジン: 溜まった分を測り、多ければ速く再生するか今の音まで飛ぶ
function catchUpLive(){
  var a=player;
  if(liveEngine!=="audio"||!a||!a.buffered.length||a.paused)return;
  var end=a.buffered.end(a.buffered.length-1);
  liveLag=Math.max(0,end-a.currentTime);
  if(liveLag>LIVE_JUMP_LAG){
    try{a.currentTime=end-0.5}catch(_){}
    a.playbackRate=1;
    liveLag=0.5;
  }else{
    a.playbackRate=liveLag>LIVE_FAST_LAG?1.1:1;
  }
}
setInterval(function(){
  if(!liveWanted||mode!=="live")return;
  var since=liveEngine==="ll"?(LL.lastAt||liveWaitSince):liveWaitSince;
  if(since&&Date.now()-since>LIVE_STALL_MS){startLive();return}
  catchUpLive();
  llWatch();
  if(!liveWanted)return;
  if(liveEngine==="ll"&&LL.lastAt)liveLag=Math.max(0,LL.next-LL.ctx.currentTime);
  if(liveEngine==="ll"?LL.lastAt:!liveWaitSince)liveUi("on");
},1000);

// ── 低遅延エンジン(WebCodecs + Web Audio) ──
var LL={ok:null,ctx:null,abort:null,dec:null,next:0,target:0.25,stableAt:0,ts:0,lastAt:0,frameUs:0,fedAt:0,idleTicks:0,blocked:false,queue:[],queued:0};
var LL_MIN=0.15,LL_MAX=1.0,LL_DROP=0.6;   // target + LL_DROP を超えて溜まったら古いフレームを捨てる
// LL.blocked: iOS などで AudioContext が止まったまま戻らないとき、次のユーザー操作まで <audio> を使う
function llSupported(){
  if(LL.blocked)return Promise.resolve(false);
  if(LL.ok!==null)return Promise.resolve(LL.ok);
  if(!window.AudioDecoder||!window.EncodedAudioChunk||!(window.AudioContext||window.webkitAudioContext)){LL.ok=false;return Promise.resolve(false)}
  return AudioDecoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:24000,numberOfChannels:1})
    .then(function(r){LL.ok=!!r.supported;return LL.ok})
    .catch(function(){LL.ok=false;return false});
}
// AudioContext と <audio> の再生許可は、ユーザー操作の中で取っておく(iOS などの自動再生制限)
var SILENT_WAV="data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
function unlockAudio(){
  if(!LL.ctx&&(window.AudioContext||window.webkitAudioContext)){
    try{LL.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"})}catch(_){}
  }
  // iOS はバックグラウンドや割り込みのあと "interrupted" のまま止まることがある
  if(LL.ctx&&LL.ctx.state!=="running")LL.ctx.resume().catch(function(){});
  LL.blocked=false;
  var a=getPlayer();
  if(!mode){a.src=SILENT_WAV;a.play().then(function(){if(!mode)a.pause()}).catch(function(){})}
}
var ADTS_RATES=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
function llStart(sel){
  llStop();
  if(!LL.ctx)unlockAudio();
  var ctx=LL.ctx;
  if(!ctx){llFail();return}
  if(ctx.state!=="running")ctx.resume().catch(function(){});
  var ac=new AbortController();
  LL.abort=ac;LL.next=0;LL.ts=0;LL.lastAt=0;LL.fedAt=0;LL.idleTicks=0;LL.stableAt=ctx.currentTime;
  fetch("/live?c="+sel.join(",")+"&prefill=0&_="+Date.now(),{signal:ac.signal,cache:"no-store"})
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      var reader=r.body.getReader(),pend=new Uint8Array(0);
      function pump(){
        return reader.read().then(function(x){
          if(x.done)throw new Error("end");
          var b=new Uint8Array(pend.length+x.value.length);
          b.set(pend);b.set(x.value,pend.length);
          pend=llFeed(b);
          return pump();
        });
      }
      return pump();
    })
    .catch(function(){if(!ac.signal.aborted&&LL.abort===ac)liveBroken()});
}
// 受信バイト列から ADTS フレームを切り出してデコーダへ。残り(次のフレームの途中)を返す
function llFeed(b){
  var i=0;
  while(b.length-i>=7){
    if(b[i]!==0xFF||(b[i+1]&0xF0)!==0xF0){i++;continue}
    var len=((b[i+3]&3)<<11)|(b[i+4]<<3)|(b[i+5]>>5);
    if(len<7){i++;continue}
    if(b.length-i<len)break;
    if(!LL.dec){
      var rate=ADTS_RATES[(b[i+2]>>2)&15],chn=((b[i+2]&1)<<2)|(b[i+3]>>6);
      LL.frameUs=1024/rate*1e6;
      // デコードできない(ADTS を受け付けない実装など)なら <audio> に切り替える
      LL.dec=new AudioDecoder({output:llOutput,error:function(){llFail()}});
      LL.dec.configure({codec:"mp4a.40.2",sampleRate:rate,numberOfChannels:chn||1});
    }
    if(LL.dec.state==="configured"){
      LL.dec.decode(new EncodedAudioChunk({type:"key",timestamp:LL.ts,data:b.slice(i,i+len)}));
      LL.ts+=LL.frameUs;
      if(!LL.fedAt)LL.fedAt=Date.now();
    }
    i+=len;
  }
  return b.slice(i);
}
// デコードした音を、前の音のすぐ後ろに隙間なく予約する。
// 開始時と途切れた後は、目標の量(LL.target)まで溜めてからまとめて予約する
// (AudioContext の時計の動き出しやデコーダの初期遅延で、余裕が削られないように)
function llOutput(ad){
  var ctx=LL.ctx,n=ad.numberOfFrames;
  if(!liveWanted||liveEngine!=="ll"||!n){ad.close();return}
  var pcm=new Float32Array(n);
  try{ad.copyTo(pcm,{planeIndex:0,format:"f32-planar"})}catch(_){ad.close();return}
  var buf=ctx.createBuffer(1,n,ad.sampleRate);
  ad.close();
  buf.copyToChannel(pcm,0);
  var now=ctx.currentTime;
  LL.lastAt=Date.now();
  if(LL.next&&LL.next<now){
    // 途切れた(回線が詰まった)→ 溜める量を増やして溜め直す
    LL.target=Math.min(LL_MAX,LL.target*1.5+0.05);
    LL.stableAt=now;LL.next=0;
  }
  if(!LL.next){
    LL.queue.push(buf);LL.queued+=buf.duration;
    if(LL.queued<LL.target)return;
    LL.next=now+0.02;
    LL.queue.forEach(llPlay);
    LL.queue=[];LL.queued=0;
    if(liveWaitSince){liveWaitSince=0;liveLag=LL.next-now;liveUi("on")}
    return;
  }
  // 溜まりすぎ → このフレームを捨てて追いつく
  if(LL.next-now>LL.target+LL_DROP)return;
  // 30 秒途切れなければ溜める量を少し減らす
  if(now-LL.stableAt>30&&LL.target>LL_MIN){LL.target=Math.max(LL_MIN,LL.target-0.05);LL.stableAt=now}
  llPlay(buf);
}
function llPlay(buf){
  var src=LL.ctx.createBufferSource();
  src.buffer=buf;src.connect(LL.ctx.destination);src.start(LL.next);
  LL.next+=buf.duration;
}
function llStop(){
  if(LL.abort){LL.abort.abort();LL.abort=null}
  if(LL.dec){try{LL.dec.close()}catch(_){}LL.dec=null}
  LL.next=0;LL.lastAt=0;LL.fedAt=0;LL.idleTicks=0;LL.queue=[];LL.queued=0;
}
function llFail(){
  if(LL.abort===null&&!LL.dec)return;
  LL.ok=false;llStop();
  if(liveWanted)startLive();
}
// 低遅延エンジンの見張り(1 秒ごと):
//  - フレームを渡して 3 秒たっても音が出てこない → デコーダが使えないとみなして <audio> へ
//  - AudioContext が 2 秒以上動いていない(iOS のバックグラウンド・割り込み後など)→ 次の操作まで <audio> へ
function llWatch(){
  if(liveEngine!=="ll"||!LL.ctx)return;
  if(LL.fedAt&&!LL.lastAt&&Date.now()-LL.fedAt>3000){llFail();return}
  if(LL.ctx.state!=="running"){
    LL.ctx.resume().catch(function(){});
    if(++LL.idleTicks>2){LL.blocked=true;llStop();startLive()}
  }else{
    LL.idleTicks=0;
  }
}

// "audio" エンジンでの開始
function audioLiveStart(sel){
  var a=getPlayer();
  liveEngine="audio";
  // 毎回 URL を変えて、溜まった古い音ではなく今の音から聞く
  a.playbackRate=1;
  a.src="/live?c="+sel.join(",")+"&_="+Date.now();
  return a.play();
}
function startLive(){
  var sel=Array.from(liveSel).sort(function(a,b){return a-b});
  if(!sel.length){lplay.textContent="ch を選択";setTimeout(function(){liveUi("off")},1200);return}
  // ライブを聞くなら録音の連続再生は終える(同じ audio 要素を切り替える)
  if(chainOn)endChain();
  liveWanted=true;
  clearTimeout(liveRetry);
  liveWaitSince=Date.now();liveLag=0;
  liveUi("wait");
  llSupported().then(function(ok){
    if(!liveWanted)return;
    llStop();
    if(mode==="clip"||liveEngine==="audio"){if(player){player.pause();player.removeAttribute("src");player.load()}}
    mode="live";
    if(ok&&!document.hidden){
      liveEngine="ll";
      llStart(sel);
    }else{
      audioLiveStart(sel).catch(function(){if(liveWanted){liveWanted=false;liveEngine=null;liveUi("off")}});
    }
    updateMediaSession();
  });
}
function stopLive(){
  liveWanted=false;
  liveWaitSince=0;liveLag=0;
  clearTimeout(liveRetry);
  llStop();
  if(mode==="live")stopPlayer();
  liveEngine=null;
  liveUi("off");
}
// 回線断などで止まったら少し待ってつなぎ直す
function liveBroken(){
  if(!liveWanted)return;
  liveUi("wait");
  clearTimeout(liveRetry);
  liveRetry=setTimeout(function(){if(liveWanted)startLive()},2000);
}
// 画面が隠れたら <audio> に切り替えて(バックグラウンド再生)、戻ったら低遅延に戻す
document.addEventListener("visibilitychange",function(){
  if(!liveWanted||mode!=="live")return;
  if(document.hidden&&liveEngine==="ll"){
    var sel=Array.from(liveSel).sort(function(a,b){return a-b});
    llStop();
    audioLiveStart(sel).catch(function(){
      // バックグラウンドで <audio> を始められない環境では低遅延のまま続ける
      liveEngine="ll";llStart(sel);
    });
  }else if(!document.hidden&&liveEngine==="audio"&&LL.ok){
    startLive();
  }
});
lplay.onclick=function(){if(liveWanted)stopLive();else{unlockAudio();startLive()}};
function makeLiveChip(id,name){
  var b=document.createElement("div");
  b.className="chip c"+id+(liveSel.has(id)?" on":"");
  b.dataset.c=id;
  b.textContent=name;
  b.onclick=function(){
    if(liveSel.has(id)){liveSel.delete(id);b.classList.remove("on")}
    else{liveSel.add(id);b.classList.add("on")}
    saveLiveSel();
    // 再生中なら選択に合わせてつなぎ直す
    if(liveWanted){if(liveSel.size)startLive();else stopLive()}
  };
  return b;
}
function saveLiveSel(){try{localStorage.setItem(LIVE,JSON.stringify(Array.from(liveSel)))}catch(_){}}
// ライブで聞くチャンネルが未選択なら、今表示しているタブのチャンネルを選ぶ
function ensureLiveSel(){
  if(liveSel.size)return true;
  Object.keys(names).forEach(function(c){if(visible(+c))liveSel.add(+c)});
  lchips.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("on",liveSel.has(+b.dataset.c))});
  saveLiveSel();
  return liveSel.size>0;
}

// ── 連続再生 ──
// ▶ を押した録音から、録音時刻の新しい方へ順に再生する。
// 最新まで聞き終えたらリアルタイム再生(ライブ)に切り替える(以降の新着はライブで聞こえる)。
var chainOn=false,lastPlayed=0;
function chainUi(){
  chainEl.hidden=!chainOn;
  chainEl.textContent="連続再生 ✕";
}
chainEl.onclick=function(){stopChain()};
// 連続再生の状態だけを終える(audio 要素はそのまま。ライブへ切り替えるとき用)
function endChain(){
  chainOn=false;
  var prev=playingId;playingId=0;
  if(prev)refreshPlay(prev);
  chainUi();
}
function stopChain(){
  endChain();
  if(mode==="clip")stopPlayer();
}
function togglePlay(g){
  if(playingId===g){stopChain();return}
  // 最新まで聞いたらライブ(低遅延は Web Audio)へ移るので、ここで再生許可を取っておく
  unlockAudio();
  chainOn=true;
  playClip(g);
}
function playClip(g){
  var prev=playingId;playingId=0;
  if(prev)refreshPlay(prev);
  // ライブ中なら止めて録音に切り替える(同じ audio 要素)
  if(liveWanted){liveWanted=false;clearTimeout(liveRetry);llStop();liveEngine=null;liveUi("off")}
  var a=getPlayer();
  mode="clip";
  a.playbackRate=1;
  a.src="/audio/"+g;
  playingId=g;lastPlayed=g;
  a.play().catch(function(){if(playingId===g)stopChain()});
  refreshPlay(g);
  chainUi();
  updateMediaSession();
  var b=log.querySelector('.pl[data-g="'+g+'"]');
  if(b&&!document.hidden)b.closest(".r").scrollIntoView({block:"nearest"});
}
function clipEnded(g){
  playingId=0;refreshPlay(g);
  if(!chainOn){stopPlayer();return}
  var n=nextSeg(g);
  if(n){playClip(n);return}
  // 最新まで追いついた → リアルタイム再生へ
  endChain();
  if(liveAvailable&&ensureLiveSel())startLive();
  else stopPlayer();
}
// 録音時刻が g の次に新しい区間(タブで表示していないチャンネルは飛ばす)
function nextSeg(g){
  var cur=segs[g],best=0,bt=Infinity;
  if(!cur)return 0;
  for(var id in segs){
    var sg=segs[id],i=+id;
    if(!visible(sg.c))continue;
    var later=sg.t>cur.t||(sg.t===cur.t&&i>g);
    if(later&&(sg.t<bt||(sg.t===bt&&i<best))){best=i;bt=sg.t}
  }
  return best;
}

// ── ロック画面・通知の表示と操作(Media Session) ──
function updateMediaSession(){
  if(!("mediaSession" in navigator))return;
  var ms=navigator.mediaSession;
  try{
    if(mode==="live"){
      var sel=Array.from(liveSel).map(function(c){return names[c]!==undefined?names[c]:"ch"+c});
      ms.metadata=new MediaMetadata({title:"ライブ: "+sel.join(" + "),artist:"dcr-transcribe"});
      ms.playbackState="playing";
    }else if(mode==="clip"&&segs[playingId]){
      var sg=segs[playingId];
      ms.metadata=new MediaMetadata({title:(names[sg.c]!==undefined?names[sg.c]:"ch"+sg.c)+" "+fmtMs(sg.t),artist:"dcr-transcribe 録音"});
      ms.playbackState="playing";
    }else{
      ms.playbackState="none";
    }
  }catch(_){}
}
if("mediaSession" in navigator){
  var msAction=function(name,fn){try{navigator.mediaSession.setActionHandler(name,fn)}catch(_){}};
  msAction("pause",function(){if(mode==="clip")stopChain();else if(mode==="live")stopLive()});
  msAction("stop",function(){if(mode==="clip")stopChain();else if(mode==="live")stopLive()});
  msAction("play",function(){if(!mode&&liveAvailable&&ensureLiveSel())startLive()});
  msAction("nexttrack",function(){if(mode==="clip"&&playingId)clipEnded(playingId)});
}

function addSeg(sg,live){
  if(segs[sg.i])return;
  segs[sg.i]={c:sg.c,t:sg.t,d:sg.d};
  if(sg.i>maxSegId)maxSegId=sg.i;
  if(log.querySelector('.r[data-g="'+sg.i+'"]'))refreshPlay(sg.i);
  else if(live||(channelFeed(sg.c).firstChild&&sg.t>=+channelFeed(sg.c).firstChild.dataset.k)){
    // 文字起こしが(まだ)ない区間は録音だけの行として出す。後から文字起こしが来たら消す。
    // 接続時にまとめて取った区間は、表示中の範囲(一番古い行より新しいもの)だけ出す
    var d=document.createElement("div");
    d.className="r sg c"+sg.c;d.dataset.channel=sg.c;d.dataset.sg=sg.i;d.dataset.g=sg.i;
    var n=names[sg.c]!==undefined?names[sg.c]:"ch"+sg.c;
    d.appendChild(el("div","meta",[el("span","name",[n]),el("span","ts",[fmtMs(sg.t)])]));
    d.appendChild(el("div","x",["(文字起こしなし)"]));
    insertSorted(d,sg.t);
    regroupAround(d);
    updateEmpty();
    noteNew();
  }
}
function loadSegs(){
  // 初回は新しい側だけ(細い回線で全件取らない)。再接続時は取りこぼし分だけ
  fetch("/segments?after="+maxSegId+(maxSegId?"":"&limit=300")).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    ((data&&data.items)||[]).forEach(function(sg){addSeg(sg,false)});
  }).catch(function(){});
}

// 過去を見ている間は新着件数だけを通知する
function noteNew(){
  if(stick)return;
  newCount++;fab.textContent="↓ 新着 "+newCount+" 件";fab.classList.add("show");
}

function append(id,e){
  if(e.g){var only=log.querySelector('[data-sg="'+e.g+'"]');if(only)only.remove()}
  regroupAround(insertSorted(makeRow(id,e),msOf(e.s)));
  if(id){
    if(id>lastSeenId)lastSeenId=id;
    if(firstShownId===0||id<firstShownId)firstShownId=id;
  }
  // 過去を読んでいる間は表示を削らない。最新追従中だけ各列の古い行を整理する。
  if(stick){
    var rows=Array.from(log.querySelectorAll(".r")).sort(function(a,b){return +a.dataset.k-+b.dataset.k});
    while(rows.length>500){rows.shift().remove();historyEnd=false}
  }
  var ids=Array.from(log.querySelectorAll(".r[data-id]")).map(function(r){return +r.dataset.id});
  firstShownId=ids.length?Math.min.apply(null,ids):0;
  updateOlderUI();
  updateEmpty();
  noteNew();
}

function appendOlder(items){
  if(!items||!items.length)return;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.g){var only=log.querySelector('[data-sg="'+it.g+'"]');if(only)only.remove()}
    regroupAround(insertSorted(makeRow(it.id,it),msOf(it.s)));
    if(it.id<firstShownId||firstShownId===0)firstShownId=it.id;
  }
  updateOlderUI();
}

function updateOlderUI(){
  older.disabled=loadingOlder||historyEnd;
  if(historyEnd)older.textContent="保存されている最初の交信です";
  else if(!loadingOlder)older.textContent="↑ 過去の交信を読み込む";
}
function loadOlder(){
  if(loadingOlder||historyEnd)return;
  stick=false;loadingOlder=true;older.disabled=true;older.textContent="読み込み中…";
  var epoch=anchorMs;
  var positions=Object.keys(feeds).map(function(c){var f=feeds[c];return {f:f,top:f.scrollTop,height:f.scrollHeight}});
  fetch("/history?before="+(firstShownId||"18446744073709551615")+"&limit=100").then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(data){
    if(epoch!==anchorMs){loadingOlder=false;updateOlderUI();return;}
    var items=(data&&data.items)||[];
    if(!items.length){historyEnd=true}else{
      appendOlder(items);
      positions.forEach(function(p){p.f.scrollTop=p.top+p.f.scrollHeight-p.height});
      document.getElementById("history-note").textContent=items.length+"件の過去の交信を追加しました";
    }
    fab.textContent="↓ 最新へ";fab.classList.add("show");
    loadingOlder=false;updateOlderUI();
  }).catch(function(){loadingOlder=false;older.disabled=false;older.textContent="再試行：過去の交信を読み込む"});
}
older.onclick=loadOlder;
fab.onclick=scrollLatest;
document.getElementById("latest").onclick=scrollLatest;

function buildStreamUrl(opts){
  var qs=[];
  if(wantP)qs.push("p=1");
  if(opts&&opts.head)qs.push("head="+opts.head);
  // 作り直した接続は Last-Event-ID を送らないので、受信済みの位置を URL で伝える
  else if(lastSeenId)qs.push("last="+lastSeenId);
  return "/stream"+(qs.length?"?"+qs.join("&"):"");
}

function connect(opts){
  if(es){try{es.close()}catch(_){}}
  es=new EventSource(buildStreamUrl(opts));
  es.addEventListener("hello",function(ev){
    try{
      var d=JSON.parse(ev.data);
      var newAnchor=new Date(d.anchor).getTime();
      // サーバが再起動した(ID が振り直されている)なら、表示を捨てて読み込み直す
      if(anchorMs&&newAnchor!==anchorMs&&lastSeenId){
        anchorMs=newAnchor;
        clearRows();updateEmpty();firstShownId=0;lastSeenId=0;
        connect();
        return;
      }
      anchorMs=newAnchor;
      // チャンネル一覧は初回のみ描画(再接続では更新しない)
      if(tabsBox.children.length===0){
        tabsBox.appendChild(makeTab("all","すべて"));
        d.channels.forEach(function(c){
          names[c.id]=c.name;
          channelFeed(c.id);
          tabsBox.appendChild(makeTab(String(c.id),c.name));
          if(d.live)lchips.appendChild(makeLiveChip(c.id,c.name));
        });
        // 以前選んでいたタブが今は無ければ「すべて」に戻す
        if(view!=="all"&&names[+view]===undefined)view="all";
        applyView();
        if(d.live){liveBar.hidden=false;liveAvailable=true}
        // 以前の選択に今は無いチャンネルが残っていたら落とす
        liveSel.forEach(function(id){if(names[id]===undefined)liveSel.delete(id)});
      }
      // 切断中に閉じた区間もここで回収する
      if(d.seg)loadSegs();
    }catch(_){}
  });
  es.addEventListener("st",function(ev){
    try{applyStatus(JSON.parse(ev.data))}catch(_){}
  });
  es.addEventListener("up",function(ev){
    try{
      H.up=JSON.parse(ev.data);
      if(!H.up.on)markStatusUnknown();
      drawHealth();
    }catch(_){}
  });
  es.addEventListener("hb",function(ev){
    try{
      H.beat=JSON.parse(ev.data);H.beatAt=Date.now();
      // サーバ → 端末の片道 = 受け取った時刻 − サーバが送った時刻(どちらも正しい時刻に直して)。端末の時計は Cloudflare のエッジで測ったときだけ
      if(H.devOff!=null&&H.edge&&H.edge.ok){
        var ow=(H.beatAt-H.devOff)-(H.beat.ms-(H.beat.so||0));
        if(ow>-1000&&ow<30000)H.down=Math.max(0,H.down==null?ow:H.down*0.7+ow*0.3);
      }
    }catch(_){}
  });
  es.addEventListener("seg",function(ev){
    try{addSeg(JSON.parse(ev.data),true)}catch(_){}
  });
  es.addEventListener("msg",function(ev){
    try{
      var id=parseInt(ev.lastEventId,10)||0;
      // つなぎ直しで同じものが届いても 2 回出さない
      if(id&&id<=lastSeenId)return;
      var data=JSON.parse(ev.data);
      // ファストロード後の最初のイベントで、前回 lastSeenId と差があれば「N 件スキップ」表示。
      // 取得した最新分のすぐ下(それより古い位置)に置く
      if(opts&&opts.gapFrom&&id>opts.gapFrom+1){
        var skipped=id-opts.gapFrom-1;
        document.getElementById("history-note").textContent=skipped+"件の未表示の交信があります。過去の交信から読み込めます";
        opts.gapFrom=null; // 一度だけ
      }
      append(id,data);
      noteTranscriptLatency(data);
    }catch(_){}
  });
  es.onopen=function(){H.sse="open";H.beatAt=Date.now();drawHealth()};
  es.onerror=function(){
    markStatusUnknown();
    probe();
    if(es.readyState===EventSource.CONNECTING){
      H.sse="reco";drawHealth();
    }else{
      // HTTP エラーで閉じた(ブラウザは自動で再接続しない)。
      // bot 確認の期限切れなら確認画面へ、それ以外(本体の再起動など)は少し待ってつなぎ直す
      H.sse="off";drawHealth();
      fetch("/session",{cache:"no-store"}).then(function(r){
        if(r.status===403){location.reload();return}
        setTimeout(function(){connect()},5000);
      }).catch(function(){setTimeout(function(){connect()},5000)});
    }
  };
}

// ファストロード: DOM をクリアして最新だけ取得
function fastReload(){
  var prevLast=lastSeenId;
  lastSeenId=0;
  clearRows();
  updateEmpty();
  firstShownId=0;
  newCount=0;
  fab.classList.remove("show");
  stick=true;
  scrollLatest();
  connect({head:FAST_HEAD,gapFrom:prevLast});
}

document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    hiddenAt=Date.now();
    wasStickyOnHide=stick;
  }else{
    var elapsed=hiddenAt?Date.now()-hiddenAt:0;
    hiddenAt=0;
    probe();
    // 最新を見ていた人だけファストロード(さかのぼって読んでいた人の位置は壊さない)
    if(elapsed>FAST_THRESHOLD_MS&&wasStickyOnHide){
      fastReload();
    }
  }
});

// ── ログアウト ──
// セッションを消し、この端末のキャッシュ・保存データも消させる(共用の端末で見たあとに残さない)
document.getElementById("logout").onclick=function(e){
  e.stopPropagation();
  this.disabled=true;this.textContent="ログアウトしています…";
  try{if(es)es.close()}catch(_){}
  fetch("/logout",{method:"POST",cache:"no-store"}).catch(function(){}).then(function(){location.replace("/")});
};

// ── 再読み込み ──
// ホーム画面から開いたとき(スタンドアロン表示)や埋め込みのブラウザでは、ブラウザの再読み込みボタンが無いので画面に置く
document.getElementById("reload").onclick=function(){
  this.disabled=true;this.textContent="…";
  location.reload();
};

// ── 閲覧画面の共有(ログイン URL を共有シート・コピー・QR で渡す) ──
// 画面側はログインキーを持っていない(ログイン後に URL から消している)ので、ログイン済みの人だけが使える /share から受け取る
var shm=document.getElementById("shm"),shurl=document.getElementById("shurl"),shqr=document.getElementById("shqr"),
    shmsg=document.getElementById("shmsg"),shnative=document.getElementById("shnative"),shareUrl="";
document.getElementById("share").onclick=function(){
  fetch("/share",{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    shareUrl=location.origin+d.path;
    shurl.textContent=shareUrl;
    shqr.src="/share/qr.svg?u="+encodeURIComponent(shareUrl);
    shnative.hidden=!navigator.share;
    shmsg.textContent="";
    shm.hidden=false;
  }).catch(function(){alert("共有用のリンクを取得できませんでした")});
};
function closeShare(){shm.hidden=true}
document.getElementById("shx").onclick=closeShare;
shm.onclick=function(e){if(e.target===shm)closeShare()};
shnative.onclick=function(){
  navigator.share({title:"dcr-transcribe",url:shareUrl}).catch(function(){});
};
document.getElementById("shcopy").onclick=function(){
  function done(){shmsg.textContent="コピーしました"}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(shareUrl).then(done).catch(fallback);
  }else fallback();
  // 古いブラウザ向け
  function fallback(){
    var t=document.createElement("textarea");
    t.value=shareUrl;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();
    try{document.execCommand("copy");done()}catch(_){shmsg.textContent="コピーできませんでした。URL を長押ししてコピーしてください"}
    document.body.removeChild(t);
  }
};

// PC 向けのキー操作
document.addEventListener("keydown",function(e){
  // 共有の窓が開いている間は Esc で閉じるだけ
  if(!shm.hidden){if(e.key==="Escape")closeShare();return}
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="0"){setView("all");return}
  if(/^[1-9]$/.test(e.key)){
    var t=tabsBox.querySelectorAll(".tab")[+e.key];
    if(t)setView(t.dataset.v);
    return;
  }
  if(e.key==="l"||e.key==="L"){lplay.click();return}
  if(e.key==="Escape"){if(chainOn)stopChain();else if(liveWanted)stopLive()}
});

connect({head:100});
probe();
drawHealth();
})();

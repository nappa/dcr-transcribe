<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>dcr-transcribe</title>
<style>
:root{
  --bg:#0f1115;--bg2:#161922;--fg:#e8eaed;--muted:#888c95;--border:#1f222a;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bot:env(safe-area-inset-bottom,0);
  --safe-l:env(safe-area-inset-left,0);
  --safe-r:env(safe-area-inset-right,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--fg);
  /* 上に行を足したときの位置補正は自前で行う(ブラウザの補正と二重にならないように) */
  overflow-anchor:none;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
/* スマホ: 上部に固定ヘッダ(タブ + ライブ)。PC: 左サイドバー(下の @media) */
#side{
  position:sticky;top:0;z-index:10;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:calc(8px + var(--safe-top)) 12px 6px;
}
.tr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tr h1{font-size:14px;margin:0;font-weight:600;flex:1}
.s{font-size:11px;padding:3px 9px;border-radius:10px;background:#2a2d34;color:var(--muted);white-space:nowrap}
.s.on{background:#1a4a2a;color:#9f9}
.s.off{background:#4a1a1a;color:#f99}
.s.reco{background:#4a3a1a;color:#fc6}
.s.chain{background:#1a3a4a;color:#8cf;cursor:pointer}
.s.chain[hidden]{display:none}
.chips{
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:0 -12px;padding:0 12px 4px;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;font-size:12px;padding:6px 12px;border-radius:14px;
  border:1px solid transparent;cursor:pointer;user-select:none;
  background:#2a2d34;color:var(--muted);
  min-height:30px;display:flex;align-items:center;
}
.chip.on{background:var(--ch-bg);color:var(--ch-fg);border-color:var(--ch-fg)}
/* チャンネルタブ(表示するチャンネルの切り替え + 受信状態) */
.tabs{
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:0 -12px 2px;padding:0 12px 6px;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;position:relative;display:flex;flex-direction:column;gap:3px;
  min-width:72px;padding:6px 10px 7px;border-radius:10px;border:1px solid transparent;
  background:#22252d;color:var(--muted);font:inherit;font-size:12px;text-align:left;cursor:pointer;
}
.tab.sel{background:var(--ch-bg,#2a3550);color:var(--ch-fg,#cfe0ff);border-color:var(--ch-fg,#6c8fd8)}
.tab .tn{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#444a55;flex-shrink:0}
.tab.rx .dot{background:#ff4d4d;box-shadow:0 0 0 3px rgba(255,77,77,.25)}
.tab .meter{height:3px;border-radius:2px;background:#2f333c;overflow:hidden}
.tab .meter i{display:block;height:100%;width:0;background:var(--ch-fg,#8aa);transition:width .25s}
.tab.rx .meter i{background:#ff6b6b}
/* 状態の文字(受信中 n秒 / 最終受信 / 待機中)は長さが変わるので、常に 1 行分の高さで折り返さない(レイアウトを動かさない) */
.tab .tst{display:none;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em;line-height:1.5em}
.tab .tx{margin-left:auto;font-size:10px;font-weight:600;padding:0 5px;border-radius:6px;background:#333842;color:#778}
.tab .tx.on{background:#1a4a2a;color:#9f9}
.tab .tx.err{background:#4a1a1a;color:#f99}
.tab.unknown .dot,.tab.unknown .meter i{opacity:.3}
@media(prefers-reduced-motion:no-preference){
  .tab.rx .dot{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,77,77,0)}}
}
.live{display:flex;align-items:center;gap:8px;margin-top:4px}
.live[hidden]{display:none}
.live .lbl{font-size:11px;color:var(--muted);flex-shrink:0}
.live .chips{flex:1;margin:0;padding:0 0 4px}
.lp{
  /* 表示(▶ 聞く / ■ 停止 0.3秒 / 接続中…)が変わっても幅を変えない */
  flex-shrink:0;width:7.5em;white-space:nowrap;font-variant-numeric:tabular-nums;
  border:none;border-radius:14px;padding:6px 8px;min-height:30px;
  background:#2a4060;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
}
.lp.on{background:#a33;}
.lp.wait{background:#665;}
#older{
  padding:10px;text-align:center;font-size:13px;color:var(--muted);
  cursor:pointer;border-top:1px solid var(--border);user-select:none;
  display:none;
}
#older.show{display:block}
#older:active{background:var(--bg2)}
#log{padding:0}
#older{margin-bottom:calc(80px + var(--safe-bot))}
#empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.r.now{box-shadow:inset 3px 0 0 var(--ch-fg)}
/* 同じ録音区間の行が続くときは 1 かたまりに見せる(▶ は一番上の行だけ) */
.r.joined{border-bottom-color:transparent;padding-bottom:2px}
.r.cont{padding-top:2px}
.r.cont .name{visibility:hidden}
.r{padding:9px 12px;border-bottom:1px solid var(--border);background:var(--ch-bg)}
.r .meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
.r .name{color:var(--ch-fg);font-weight:600}
.r .ts{font-variant-numeric:tabular-nums}
.r .x{font-size:15px;word-break:break-word}
.p{opacity:.55;font-style:italic}
.pl{
  margin-left:auto;flex-shrink:0;border:1px solid var(--ch-fg);background:transparent;color:var(--ch-fg);
  border-radius:12px;font-size:11px;padding:1px 9px;min-width:56px;cursor:pointer;
  font-family:inherit;font-variant-numeric:tabular-nums;font-style:normal;
}
.pl:disabled{opacity:.4;cursor:default}
.pl.on{background:var(--ch-fg);color:var(--ch-bg)}
.sg .x{color:var(--muted);font-size:13px}
.gap{
  padding:6px 12px;background:#2a2030;color:#fc6;font-size:11px;text-align:center;
  border-bottom:1px solid var(--border);
}
.c0{--ch-bg:#14233a;--ch-fg:#6cb6ff}
.c1{--ch-bg:#143a1c;--ch-fg:#6cf99a}
.c2{--ch-bg:#3a2e14;--ch-fg:#ffd86c}
.c3{--ch-bg:#3a1820;--ch-fg:#ff90b0}
.c4{--ch-bg:#2a1838;--ch-fg:#cc88ff}
.c5{--ch-bg:#3a2c14;--ch-fg:#ffb060}
.c6{--ch-bg:#143a3a;--ch-fg:#6cffe0}
.c7{--ch-bg:#2a2a2a;--ch-fg:#c0c0c0}
.c8{--ch-bg:#3a2614;--ch-fg:#ff9c70}
.c9{--ch-bg:#143a30;--ch-fg:#6cffaa}
.fab{
  position:fixed;left:50%;bottom:calc(20px + var(--safe-bot));
  transform:translateX(-50%);
  background:#2a4060;color:#fff;border:none;
  padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;display:none;z-index:5;
  font-family:inherit;
}
.fab.show{display:block}
@media(prefers-reduced-motion:no-preference){
  .r{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}}
}
/* PC: 左にチャンネルのカード、右に読みやすい幅のタイムライン */
@media(min-width:900px){
  body{font-size:16px}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr)}
  #side{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    border-bottom:none;border-right:1px solid var(--border);padding:16px;
  }
  .tr h1{font-size:16px}
  .tabs{flex-direction:column;overflow:visible;margin:8px 0 14px;padding:0;gap:8px}
  .tab{min-width:0;padding:10px 12px;font-size:13px;gap:6px}
  .tab .meter{height:5px}
  .tab .tst{display:block;color:var(--muted)}
  .tab.rx .tst{color:#ff8a8a}
  .tab:hover{border-color:#3a3f4a}
  .live{flex-wrap:wrap;margin-top:0}
  .live .lbl{width:100%;font-size:12px}
  .live .chips{flex-wrap:wrap;overflow:visible;flex:1 1 100%}
  .lp{width:100%;min-height:36px;font-size:13px}
  main{max-width:880px;width:100%;justify-self:center}
  .r{padding:11px 20px}
  .r .x{font-size:16px;line-height:1.6}
  .r:hover{filter:brightness(1.12)}
  .fab{left:calc(300px + (100vw - 300px)/2)}
  .keys{display:block}
}
.keys{display:none;margin-top:14px;font-size:11px;color:var(--muted);line-height:1.7}
.keys kbd{background:#2a2d34;border-radius:4px;padding:0 5px;font-family:inherit}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="tr">
    <h1>dcr-transcribe</h1>
    <span class="s chain" id="chain" hidden></span>
    <span class="s off" id="s">未接続</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="live" id="live" hidden>
    <span class="lbl">ライブ</span>
    <div class="chips" id="lchips"></div>
    <button class="lp" id="lplay">▶ 聞く</button>
  </div>
  <div class="keys"><kbd>0</kbd> すべて <kbd>1</kbd>〜<kbd>9</kbd> チャンネル <kbd>L</kbd> ライブ <kbd>Esc</kbd> 再生停止</div>
</aside>
<main>
  <div id="log"></div>
  <div id="empty" hidden>まだ受信していません</div>
  <div id="older">↓ もっと前を読み込む</div>
</main>
</div>
<button class="fab" id="fab">↑ 最新へ</button>
<script>
(function(){
var liveBar=document.getElementById("live"),lchips=document.getElementById("lchips"),lplay=document.getElementById("lplay");
var log=document.getElementById("log"),stat=document.getElementById("s"),tabsBox=document.getElementById("tabs"),fab=document.getElementById("fab"),older=document.getElementById("older"),emptyEl=document.getElementById("empty");
var p=new URLSearchParams(location.search);
var wantP=p.get("p")==="1";
var TAB="dcr-tab";
// 表示するチャンネル("all" かチャンネル ID)
var view=localStorage.getItem(TAB)||"all";
var LIVE="dcr-live";
var liveSel=new Set(JSON.parse(localStorage.getItem(LIVE)||"[]"));

// 状態
// 行は新しいものが上。各行の data-k に時刻(ms)を持たせ、時刻の降順に挿入する
var es=null;
var anchorMs=0;
var names={};
var stick=true;            // 最上部(最新)を見ているか
var newCount=0;
var firstShownId=0;        // DOM 上で最も古いイベント ID(0 = まだ何もない)
var lastSeenId=0;          // 受信済みの最大 ID
var loadingOlder=false;
var hiddenAt=0;
var wasStickyOnHide=true;
var FAST_THRESHOLD_MS=30000; // この時間以上 hidden だったらファストロード
var FAST_HEAD=20;            // ファストロード時に取得する件数
var segs={};               // 録音区間 id -> {c,t,d}
var maxSegId=0;
var playingId=0;
var chainEl=document.getElementById("chain");

function pad(n){return n<10?"0"+n:""+n}
function msOf(s){return anchorMs+s*1000}
function fmtMs(ms){if(!ms)return"";var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function atTop(){return window.scrollY<80}
function nearBottom(){return(window.innerHeight+window.scrollY)>=document.documentElement.scrollHeight-200}
function scrollTop(){window.scrollTo(0,0)}

function visible(c){return view==="all"||+view===c}

// ── チャンネルタブ ──
// 選んだチャンネル以外の行を CSS で隠す(DOM はそのまま)
function applyView(){
  var st=document.getElementById("vs");
  if(!st){st=document.createElement("style");st.id="vs";document.head.appendChild(st)}
  st.textContent=view==="all"?"":"#log>*:not(.c"+(+view)+"){display:none}";
  tabsBox.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("sel",t.dataset.v===String(view))});
  updateEmpty();
}
function setView(v){
  view=String(v);
  try{localStorage.setItem(TAB,view)}catch(_){}
  applyView();
  scrollTop();
}
function updateEmpty(){
  var any=view==="all"?log.firstChild:log.querySelector(".c"+(+view));
  emptyEl.hidden=!!any;
}
function makeTab(v,name){
  var b=document.createElement("button");
  b.className="tab"+(v==="all"?"":" c"+v+" unknown");
  b.dataset.v=v;
  b.innerHTML='<span class="tn">'+(v==="all"?"":'<span class="dot"></span>')+'<span>'+esc(name)+'</span>'+(v==="all"?"":'<span class="tx" title="Transcribe">T</span>')+'</span>'
    +(v==="all"?'<span class="tst" data-all></span>':'<span class="meter"><i></i></span><span class="tst">—</span>');
  b.onclick=function(){setView(v)};
  return b;
}

// ── 受信状態(event: st) ──
// [c, 音量dB, 受信中, Transcribe(0=未接続 1=接続中 2=エラー)]。変化したチャンネルだけ届く
var chs={};   // c -> {l, r, x, since(受信開始), last(最後に受信していた時刻)}
function applyStatus(list){
  var now=Date.now();
  list.forEach(function(a){
    var c=a[0],cur=chs[c]||{};
    var r=a[2]===1;
    if(r&&!cur.r)cur.since=now;
    if(!r&&cur.r)cur.last=now;
    cur.l=a[1];cur.r=r;cur.x=a[3];
    chs[c]=cur;
    drawTab(c);
  });
  drawAllTab();
}
function ago(ms){
  var s=Math.floor(ms/1000);
  if(s<60)return s+"秒";
  if(s<3600)return Math.floor(s/60)+"分";
  return Math.floor(s/3600)+"時間";
}
function drawTab(c){
  var t=tabsBox.querySelector('.tab[data-v="'+c+'"]'),st=chs[c];
  if(!t||!st)return;
  t.classList.remove("unknown");
  t.classList.toggle("rx",st.r);
  t.querySelector(".meter i").style.width=Math.max(0,Math.min(100,(st.l+60)/60*100))+"%";
  var tx=t.querySelector(".tx");
  tx.className="tx"+(st.x===1?" on":st.x===2?" err":"");
  tx.title=st.x===1?"Transcribe 接続中":st.x===2?"Transcribe エラー":"Transcribe 未接続";
  var now=Date.now();
  t.querySelector(".tst").textContent=st.r?"受信中 "+ago(now-st.since)
    :st.last?"最終受信 "+ago(now-st.last)+"前":"待機中";
}
function drawAllTab(){
  var t=tabsBox.querySelector("[data-all]");
  if(!t)return;
  var n=0;for(var c in chs)if(chs[c].r)n++;
  t.textContent=n?"受信中 "+n+" ch":"待機中";
  t.closest(".tab").classList.toggle("rx",n>0);
}
// 経過秒の表示を進める(通信なし)
setInterval(function(){for(var c in chs)drawTab(c)},1000);
// 切断中は状態が古いので薄く表示
function markStatusUnknown(){tabsBox.querySelectorAll(".tab[data-v]:not([data-v=all])").forEach(function(t){t.classList.add("unknown")})}

function makeRow(id,e){
  var d=document.createElement("div");
  d.className="r c"+e.c+(e.p?" p":"");
  if(id)d.dataset.id=id;
  if(e.g)d.dataset.g=e.g;
  var n=names[e.c]!==undefined?names[e.c]:"ch"+e.c;
  d.innerHTML='<div class="meta"><span class="name">'+esc(n)+'</span><span class="ts">'+fmtMs(msOf(e.s))+'</span></div><div class="x">'+esc(e.x)+'</div>';
  return d;
}

// 時刻の降順(新しいものが上)を保って挿入する。同時刻なら後から来たものを下に置く。
// 見ている位置より上に入ったら、そのぶんスクロールして表示がずれないようにする。
function insertSorted(d,k){
  d.dataset.k=k;
  var before=null;
  for(var c=log.firstChild;c;c=c.nextSibling){
    if(+c.dataset.k<k){before=c;break}
  }
  var prevH=document.documentElement.scrollHeight;
  log.insertBefore(d,before);
  if(!stick&&d.getBoundingClientRect().top<0){
    window.scrollBy(0,document.documentElement.scrollHeight-prevH);
  }
  return d;
}

// ── 録音区間の再生 ──
function makePlay(g){
  var b=document.createElement("button");
  b.className="pl";b.dataset.g=g;
  setPlay(b);
  b.onclick=function(){togglePlay(g)};
  return b;
}
function setPlay(b){
  var g=+b.dataset.g,sg=segs[g];
  b.disabled=!sg;
  b.classList.toggle("on",g===playingId);
  // 一覧に無いのは、まだ録音中か、サーバの保持件数を超えて消えたもの
  b.textContent=!sg?(g<=maxSegId?"録音なし":"録音中"):g===playingId?"■ 停止":"▶ "+(sg.d/1000).toFixed(1)+"秒";
}
function refreshPlay(g){
  log.querySelectorAll('.pl[data-g="'+g+'"]').forEach(setPlay);
  log.querySelectorAll('.r[data-g="'+g+'"]').forEach(function(r){r.classList.toggle("now",g===playingId)});
}
// 同じ録音区間の行のうち、一番上(新しい側)の行にだけ ▶ を置き、隣り合う行をつなげて見せる
function groupSeg(g){
  var rows=log.querySelectorAll('.r[data-g="'+g+'"]');
  for(var i=0;i<rows.length;i++){
    var r=rows[i],b=r.querySelector(".pl");
    if(i===0){if(!b)r.querySelector(".meta").appendChild(makePlay(g))}
    else if(b)b.remove();
    var next=r.nextElementSibling,prev=r.previousElementSibling;
    r.classList.toggle("joined",!!next&&next.dataset.g===String(g));
    r.classList.toggle("cont",!!prev&&prev.dataset.g===String(g));
  }
  refreshPlay(g);
}
// 行を挿入したら、その行と上下の行が属するかたまりを組み直す
function regroupAround(d){
  var gs={};
  [d,d.previousElementSibling,d.nextElementSibling].forEach(function(r){if(r&&r.dataset.g)gs[r.dataset.g]=1});
  for(var g in gs)groupSeg(+g);
}

// ── 再生(録音とライブで 1 つの audio 要素を使い回す) ──
// iOS などは画面ロック中・別アプリ表示中に「新しい」audio 要素の再生を始められない。
// 同じ要素の src を切り替えて続けることで、バックグラウンドでも連続再生 → ライブへ移れるようにする。
// ロック画面・通知の操作は Media Session で出す。
var player=null,mode=null;   // mode: "clip"(録音) | "live" | null
var liveAvailable=false;
function getPlayer(){
  if(player)return player;
  player=new Audio();
  player.preload="auto";
  player.addEventListener("ended",function(){
    if(mode==="clip"&&playingId)clipEnded(playingId);
    else if(mode==="live"&&liveEngine==="audio")liveBroken();
  });
  player.addEventListener("error",function(){
    // 読み込めない録音で止まり続けないよう、失敗したら連続再生ごと止める
    if(mode==="clip"&&playingId)stopChain();
    else if(mode==="live"&&liveEngine==="audio")liveBroken();
  });
  player.addEventListener("playing",function(){if(mode==="live"&&liveEngine==="audio"){liveWaitSince=0;catchUpLive();liveUi("on")}});
  player.addEventListener("waiting",function(){if(mode==="live"&&liveEngine==="audio"){if(!liveWaitSince)liveWaitSince=Date.now();liveUi("wait")}});
  return player;
}
function stopPlayer(){
  mode=null;
  if(player){player.pause();player.removeAttribute("src");player.load()}
  updateMediaSession();
}

// ── ライブ再生(選んだチャンネルをサーバでミックスした AAC ストリーム) ──
// 再生エンジンは 2 つ:
//   "ll"   : 低遅延。fetch で ADTS を受け取り WebCodecs でデコード、Web Audio で再生時刻を自分で管理する。
//            溜める量(jitter バッファ)を 0.15〜1 秒で回線に合わせて自動調整する
//   "audio": <audio> に任せる。WebCodecs 非対応のブラウザと、画面が隠れている間(バックグラウンド再生)に使う。
//            Chrome は再生を続けるのに約 2.3 秒溜めるので遅延は大きい。溜まりすぎたら速く再生・飛ばす:
//            3 秒超: 少し速く / 5 秒超: 今の音まで飛ぶ。接続直後のサーバの無音(プリフィル)も飛ばす
// どちらも 10 秒以上音が届かなければつなぎ直す
var liveWanted=false,liveRetry=0,liveWaitSince=0,liveLag=0,liveEngine=null;
var LIVE_FAST_LAG=3,LIVE_JUMP_LAG=5,LIVE_STALL_MS=10000;
function liveUi(state){
  lplay.className="lp"+(state==="on"?" on":state==="wait"?" wait":"");
  var lag=liveEngine==="ll"||liveLag>LIVE_FAST_LAG?" "+liveLag.toFixed(1)+"秒":"";
  lplay.textContent=state==="on"?"■ 停止"+lag:state==="wait"?"接続中…":"▶ 聞く";
  lplay.title=lag?"遅延"+lag:"";
}
// "audio" エンジン: 溜まった分を測り、多ければ速く再生するか今の音まで飛ぶ
function catchUpLive(){
  var a=player;
  if(liveEngine!=="audio"||!a||!a.buffered.length||a.paused)return;
  var end=a.buffered.end(a.buffered.length-1);
  liveLag=Math.max(0,end-a.currentTime);
  if(liveLag>LIVE_JUMP_LAG){
    try{a.currentTime=end-0.5}catch(_){}
    a.playbackRate=1;
    liveLag=0.5;
  }else{
    a.playbackRate=liveLag>LIVE_FAST_LAG?1.1:1;
  }
}
setInterval(function(){
  if(!liveWanted||mode!=="live")return;
  var since=liveEngine==="ll"?(LL.lastAt||liveWaitSince):liveWaitSince;
  if(since&&Date.now()-since>LIVE_STALL_MS){startLive();return}
  catchUpLive();
  llWatch();
  if(!liveWanted)return;
  if(liveEngine==="ll"&&LL.lastAt)liveLag=Math.max(0,LL.next-LL.ctx.currentTime);
  if(liveEngine==="ll"?LL.lastAt:!liveWaitSince)liveUi("on");
},1000);

// ── 低遅延エンジン(WebCodecs + Web Audio) ──
var LL={ok:null,ctx:null,abort:null,dec:null,next:0,target:0.25,stableAt:0,ts:0,lastAt:0,frameUs:0,fedAt:0,idleTicks:0,blocked:false,queue:[],queued:0};
var LL_MIN=0.15,LL_MAX=1.0,LL_DROP=0.6;   // target + LL_DROP を超えて溜まったら古いフレームを捨てる
// LL.blocked: iOS などで AudioContext が止まったまま戻らないとき、次のユーザー操作まで <audio> を使う
function llSupported(){
  if(LL.blocked)return Promise.resolve(false);
  if(LL.ok!==null)return Promise.resolve(LL.ok);
  if(!window.AudioDecoder||!window.EncodedAudioChunk||!(window.AudioContext||window.webkitAudioContext)){LL.ok=false;return Promise.resolve(false)}
  return AudioDecoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:24000,numberOfChannels:1})
    .then(function(r){LL.ok=!!r.supported;return LL.ok})
    .catch(function(){LL.ok=false;return false});
}
// AudioContext と <audio> の再生許可は、ユーザー操作の中で取っておく(iOS などの自動再生制限)
var SILENT_WAV="data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
function unlockAudio(){
  if(!LL.ctx&&(window.AudioContext||window.webkitAudioContext)){
    try{LL.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"})}catch(_){}
  }
  // iOS はバックグラウンドや割り込みのあと "interrupted" のまま止まることがある
  if(LL.ctx&&LL.ctx.state!=="running")LL.ctx.resume().catch(function(){});
  LL.blocked=false;
  var a=getPlayer();
  if(!mode){a.src=SILENT_WAV;a.play().then(function(){if(!mode)a.pause()}).catch(function(){})}
}
var ADTS_RATES=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
function llStart(sel){
  llStop();
  if(!LL.ctx)unlockAudio();
  var ctx=LL.ctx;
  if(!ctx){llFail();return}
  if(ctx.state!=="running")ctx.resume().catch(function(){});
  var ac=new AbortController();
  LL.abort=ac;LL.next=0;LL.ts=0;LL.lastAt=0;LL.fedAt=0;LL.idleTicks=0;LL.stableAt=ctx.currentTime;
  fetch("/live?c="+sel.join(",")+"&prefill=0&_="+Date.now(),{signal:ac.signal,cache:"no-store"})
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      var reader=r.body.getReader(),pend=new Uint8Array(0);
      function pump(){
        return reader.read().then(function(x){
          if(x.done)throw new Error("end");
          var b=new Uint8Array(pend.length+x.value.length);
          b.set(pend);b.set(x.value,pend.length);
          pend=llFeed(b);
          return pump();
        });
      }
      return pump();
    })
    .catch(function(){if(!ac.signal.aborted&&LL.abort===ac)liveBroken()});
}
// 受信バイト列から ADTS フレームを切り出してデコーダへ。残り(次のフレームの途中)を返す
function llFeed(b){
  var i=0;
  while(b.length-i>=7){
    if(b[i]!==0xFF||(b[i+1]&0xF0)!==0xF0){i++;continue}
    var len=((b[i+3]&3)<<11)|(b[i+4]<<3)|(b[i+5]>>5);
    if(len<7){i++;continue}
    if(b.length-i<len)break;
    if(!LL.dec){
      var rate=ADTS_RATES[(b[i+2]>>2)&15],chn=((b[i+2]&1)<<2)|(b[i+3]>>6);
      LL.frameUs=1024/rate*1e6;
      // デコードできない(ADTS を受け付けない実装など)なら <audio> に切り替える
      LL.dec=new AudioDecoder({output:llOutput,error:function(){llFail()}});
      LL.dec.configure({codec:"mp4a.40.2",sampleRate:rate,numberOfChannels:chn||1});
    }
    if(LL.dec.state==="configured"){
      LL.dec.decode(new EncodedAudioChunk({type:"key",timestamp:LL.ts,data:b.slice(i,i+len)}));
      LL.ts+=LL.frameUs;
      if(!LL.fedAt)LL.fedAt=Date.now();
    }
    i+=len;
  }
  return b.slice(i);
}
// デコードした音を、前の音のすぐ後ろに隙間なく予約する。
// 開始時と途切れた後は、目標の量(LL.target)まで溜めてからまとめて予約する
// (AudioContext の時計の動き出しやデコーダの初期遅延で、余裕が削られないように)
function llOutput(ad){
  var ctx=LL.ctx,n=ad.numberOfFrames;
  if(!liveWanted||liveEngine!=="ll"||!n){ad.close();return}
  var pcm=new Float32Array(n);
  try{ad.copyTo(pcm,{planeIndex:0,format:"f32-planar"})}catch(_){ad.close();return}
  var buf=ctx.createBuffer(1,n,ad.sampleRate);
  ad.close();
  buf.copyToChannel(pcm,0);
  var now=ctx.currentTime;
  LL.lastAt=Date.now();
  if(LL.next&&LL.next<now){
    // 途切れた(回線が詰まった)→ 溜める量を増やして溜め直す
    LL.target=Math.min(LL_MAX,LL.target*1.5+0.05);
    LL.stableAt=now;LL.next=0;
  }
  if(!LL.next){
    LL.queue.push(buf);LL.queued+=buf.duration;
    if(LL.queued<LL.target)return;
    LL.next=now+0.02;
    LL.queue.forEach(llPlay);
    LL.queue=[];LL.queued=0;
    if(liveWaitSince){liveWaitSince=0;liveLag=LL.next-now;liveUi("on")}
    return;
  }
  // 溜まりすぎ → このフレームを捨てて追いつく
  if(LL.next-now>LL.target+LL_DROP)return;
  // 30 秒途切れなければ溜める量を少し減らす
  if(now-LL.stableAt>30&&LL.target>LL_MIN){LL.target=Math.max(LL_MIN,LL.target-0.05);LL.stableAt=now}
  llPlay(buf);
}
function llPlay(buf){
  var src=LL.ctx.createBufferSource();
  src.buffer=buf;src.connect(LL.ctx.destination);src.start(LL.next);
  LL.next+=buf.duration;
}
function llStop(){
  if(LL.abort){LL.abort.abort();LL.abort=null}
  if(LL.dec){try{LL.dec.close()}catch(_){}LL.dec=null}
  LL.next=0;LL.lastAt=0;LL.fedAt=0;LL.idleTicks=0;LL.queue=[];LL.queued=0;
}
function llFail(){
  if(LL.abort===null&&!LL.dec)return;
  LL.ok=false;llStop();
  if(liveWanted)startLive();
}
// 低遅延エンジンの見張り(1 秒ごと):
//  - フレームを渡して 3 秒たっても音が出てこない → デコーダが使えないとみなして <audio> へ
//  - AudioContext が 2 秒以上動いていない(iOS のバックグラウンド・割り込み後など)→ 次の操作まで <audio> へ
function llWatch(){
  if(liveEngine!=="ll"||!LL.ctx)return;
  if(LL.fedAt&&!LL.lastAt&&Date.now()-LL.fedAt>3000){llFail();return}
  if(LL.ctx.state!=="running"){
    LL.ctx.resume().catch(function(){});
    if(++LL.idleTicks>2){LL.blocked=true;llStop();startLive()}
  }else{
    LL.idleTicks=0;
  }
}

// "audio" エンジンでの開始
function audioLiveStart(sel){
  var a=getPlayer();
  liveEngine="audio";
  // 毎回 URL を変えて、溜まった古い音ではなく今の音から聞く
  a.playbackRate=1;
  a.src="/live?c="+sel.join(",")+"&_="+Date.now();
  return a.play();
}
function startLive(){
  var sel=Array.from(liveSel).sort(function(a,b){return a-b});
  if(!sel.length){lplay.textContent="ch を選択";setTimeout(function(){liveUi("off")},1200);return}
  // ライブを聞くなら録音の連続再生は終える(同じ audio 要素を切り替える)
  if(chainOn)endChain();
  liveWanted=true;
  clearTimeout(liveRetry);
  liveWaitSince=Date.now();liveLag=0;
  liveUi("wait");
  llSupported().then(function(ok){
    if(!liveWanted)return;
    llStop();
    if(mode==="clip"||liveEngine==="audio"){if(player){player.pause();player.removeAttribute("src");player.load()}}
    mode="live";
    if(ok&&!document.hidden){
      liveEngine="ll";
      llStart(sel);
    }else{
      audioLiveStart(sel).catch(function(){if(liveWanted){liveWanted=false;liveEngine=null;liveUi("off")}});
    }
    updateMediaSession();
  });
}
function stopLive(){
  liveWanted=false;
  liveWaitSince=0;liveLag=0;
  clearTimeout(liveRetry);
  llStop();
  if(mode==="live")stopPlayer();
  liveEngine=null;
  liveUi("off");
}
// 回線断などで止まったら少し待ってつなぎ直す
function liveBroken(){
  if(!liveWanted)return;
  liveUi("wait");
  clearTimeout(liveRetry);
  liveRetry=setTimeout(function(){if(liveWanted)startLive()},2000);
}
// 画面が隠れたら <audio> に切り替えて(バックグラウンド再生)、戻ったら低遅延に戻す
document.addEventListener("visibilitychange",function(){
  if(!liveWanted||mode!=="live")return;
  if(document.hidden&&liveEngine==="ll"){
    var sel=Array.from(liveSel).sort(function(a,b){return a-b});
    llStop();
    audioLiveStart(sel).catch(function(){
      // バックグラウンドで <audio> を始められない環境では低遅延のまま続ける
      liveEngine="ll";llStart(sel);
    });
  }else if(!document.hidden&&liveEngine==="audio"&&LL.ok){
    startLive();
  }
});
lplay.onclick=function(){if(liveWanted)stopLive();else{unlockAudio();startLive()}};
function makeLiveChip(id,name){
  var b=document.createElement("div");
  b.className="chip c"+id+(liveSel.has(id)?" on":"");
  b.dataset.c=id;
  b.textContent=name;
  b.onclick=function(){
    if(liveSel.has(id)){liveSel.delete(id);b.classList.remove("on")}
    else{liveSel.add(id);b.classList.add("on")}
    saveLiveSel();
    // 再生中なら選択に合わせてつなぎ直す
    if(liveWanted){if(liveSel.size)startLive();else stopLive()}
  };
  return b;
}
function saveLiveSel(){try{localStorage.setItem(LIVE,JSON.stringify(Array.from(liveSel)))}catch(_){}}
// ライブで聞くチャンネルが未選択なら、今表示しているタブのチャンネルを選ぶ
function ensureLiveSel(){
  if(liveSel.size)return true;
  Object.keys(names).forEach(function(c){if(visible(+c))liveSel.add(+c)});
  lchips.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("on",liveSel.has(+b.dataset.c))});
  saveLiveSel();
  return liveSel.size>0;
}

// ── 連続再生 ──
// ▶ を押した録音から、録音時刻の新しい方へ順に再生する。
// 最新まで聞き終えたらリアルタイム再生(ライブ)に切り替える(以降の新着はライブで聞こえる)。
var chainOn=false,lastPlayed=0;
function chainUi(){
  chainEl.hidden=!chainOn;
  chainEl.textContent="連続再生 ✕";
}
chainEl.onclick=function(){stopChain()};
// 連続再生の状態だけを終える(audio 要素はそのまま。ライブへ切り替えるとき用)
function endChain(){
  chainOn=false;
  var prev=playingId;playingId=0;
  if(prev)refreshPlay(prev);
  chainUi();
}
function stopChain(){
  endChain();
  if(mode==="clip")stopPlayer();
}
function togglePlay(g){
  if(playingId===g){stopChain();return}
  // 最新まで聞いたらライブ(低遅延は Web Audio)へ移るので、ここで再生許可を取っておく
  unlockAudio();
  chainOn=true;
  playClip(g);
}
function playClip(g){
  var prev=playingId;playingId=0;
  if(prev)refreshPlay(prev);
  // ライブ中なら止めて録音に切り替える(同じ audio 要素)
  if(liveWanted){liveWanted=false;clearTimeout(liveRetry);llStop();liveEngine=null;liveUi("off")}
  var a=getPlayer();
  mode="clip";
  a.playbackRate=1;
  a.src="/audio/"+g;
  playingId=g;lastPlayed=g;
  a.play().catch(function(){if(playingId===g)stopChain()});
  refreshPlay(g);
  chainUi();
  updateMediaSession();
  var b=log.querySelector('.pl[data-g="'+g+'"]');
  if(b&&!document.hidden)b.closest(".r").scrollIntoView({block:"nearest"});
}
function clipEnded(g){
  playingId=0;refreshPlay(g);
  if(!chainOn){stopPlayer();return}
  var n=nextSeg(g);
  if(n){playClip(n);return}
  // 最新まで追いついた → リアルタイム再生へ
  endChain();
  if(liveAvailable&&ensureLiveSel())startLive();
  else stopPlayer();
}
// 録音時刻が g の次に新しい区間(タブで表示していないチャンネルは飛ばす)
function nextSeg(g){
  var cur=segs[g],best=0,bt=Infinity;
  if(!cur)return 0;
  for(var id in segs){
    var sg=segs[id],i=+id;
    if(!visible(sg.c))continue;
    var later=sg.t>cur.t||(sg.t===cur.t&&i>g);
    if(later&&(sg.t<bt||(sg.t===bt&&i<best))){best=i;bt=sg.t}
  }
  return best;
}

// ── ロック画面・通知の表示と操作(Media Session) ──
function updateMediaSession(){
  if(!("mediaSession" in navigator))return;
  var ms=navigator.mediaSession;
  try{
    if(mode==="live"){
      var sel=Array.from(liveSel).map(function(c){return names[c]!==undefined?names[c]:"ch"+c});
      ms.metadata=new MediaMetadata({title:"ライブ: "+sel.join(" + "),artist:"dcr-transcribe"});
      ms.playbackState="playing";
    }else if(mode==="clip"&&segs[playingId]){
      var sg=segs[playingId];
      ms.metadata=new MediaMetadata({title:(names[sg.c]!==undefined?names[sg.c]:"ch"+sg.c)+" "+fmtMs(sg.t),artist:"dcr-transcribe 録音"});
      ms.playbackState="playing";
    }else{
      ms.playbackState="none";
    }
  }catch(_){}
}
if("mediaSession" in navigator){
  var msAction=function(name,fn){try{navigator.mediaSession.setActionHandler(name,fn)}catch(_){}};
  msAction("pause",function(){if(mode==="clip")stopChain();else if(mode==="live")stopLive()});
  msAction("stop",function(){if(mode==="clip")stopChain();else if(mode==="live")stopLive()});
  msAction("play",function(){if(!mode&&liveAvailable&&ensureLiveSel())startLive()});
  msAction("nexttrack",function(){if(mode==="clip"&&playingId)clipEnded(playingId)});
}

function addSeg(sg,live){
  if(segs[sg.i])return;
  segs[sg.i]={c:sg.c,t:sg.t,d:sg.d};
  if(sg.i>maxSegId)maxSegId=sg.i;
  if(log.querySelector('.r[data-g="'+sg.i+'"]'))refreshPlay(sg.i);
  else if(live||(log.lastChild&&sg.t>=+log.lastChild.dataset.k)){
    // 文字起こしが(まだ)ない区間は録音だけの行として出す。後から文字起こしが来たら消す。
    // 接続時にまとめて取った区間は、表示中の範囲(一番古い行より新しいもの)だけ出す
    var d=document.createElement("div");
    d.className="r sg c"+sg.c;d.dataset.sg=sg.i;d.dataset.g=sg.i;
    var n=names[sg.c]!==undefined?names[sg.c]:"ch"+sg.c;
    d.innerHTML='<div class="meta"><span class="name">'+esc(n)+'</span><span class="ts">'+fmtMs(sg.t)+'</span></div><div class="x">(文字起こしなし)</div>';
    insertSorted(d,sg.t);
    regroupAround(d);
    updateEmpty();
    noteNew();
  }
}
function loadSegs(){
  // 初回は新しい側だけ(細い回線で全件取らない)。再接続時は取りこぼし分だけ
  fetch("/segments?after="+maxSegId+(maxSegId?"":"&limit=300")).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    ((data&&data.items)||[]).forEach(function(sg){addSeg(sg,false)});
  }).catch(function(){});
}

function makeGapNote(n){
  var d=document.createElement("div");
  d.className="gap";
  d.textContent="… "+n+" 件スキップ(↓下端で読み込み)";
  return d;
}

// 見ていない間に上へ新着が入ったら件数を出す
function noteNew(){
  if(stick)return;
  newCount++;fab.textContent="↑ 新着 "+newCount+" 件";fab.classList.add("show");
}

function append(id,e){
  if(e.g){var only=log.querySelector('[data-sg="'+e.g+'"]');if(only)log.removeChild(only)}
  regroupAround(insertSorted(makeRow(id,e),msOf(e.s)));
  if(id){
    if(id>lastSeenId)lastSeenId=id;
    if(firstShownId===0||id<firstShownId)firstShownId=id;
  }
  // 古い(下端の)行から捨てる
  while(log.children.length>500)log.removeChild(log.lastChild);
  if(log.lastChild&&log.lastChild.dataset.g)groupSeg(+log.lastChild.dataset.g);
  updateOlderUI();
  updateEmpty();
  noteNew();
}

function appendOlder(items){
  if(!items||!items.length)return;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    regroupAround(insertSorted(makeRow(it.id,it),msOf(it.s)));
    if(it.id<firstShownId||firstShownId===0)firstShownId=it.id;
  }
  updateOlderUI();
}

function updateOlderUI(){
  if(firstShownId>1)older.classList.add("show");
  else older.classList.remove("show");
}

function loadOlder(){
  if(loadingOlder||firstShownId<=1)return;
  loadingOlder=true;
  older.textContent="読み込み中…";
  var url="/history?before="+firstShownId+"&limit=50";
  fetch(url).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    var items=(data&&data.items)||[];
    if(items.length===0){
      // それ以上古いものは server にも無い → ボタンを「これ以上ない」表示にして無効化
      older.textContent="これより前の履歴はありません";
      firstShownId=1; // 再 fetch を抑止
      setTimeout(function(){older.classList.remove("show")},1500);
    }else{
      appendOlder(items);
      older.textContent="↓ もっと前を読み込む";
    }
    loadingOlder=false;
  }).catch(function(){
    older.textContent="↓ もっと前を読み込む(失敗・タップで再試行)";
    loadingOlder=false;
  });
}
older.onclick=loadOlder;

addEventListener("scroll",function(){
  stick=atTop();
  if(stick){newCount=0;fab.classList.remove("show")}
  // 下端近くで自動的にさかのぼり
  if(!loadingOlder&&nearBottom()&&firstShownId>1)loadOlder();
},{passive:true});

fab.onclick=function(){scrollTop();newCount=0;fab.classList.remove("show")};

function buildStreamUrl(opts){
  var qs=[];
  if(wantP)qs.push("p=1");
  if(opts&&opts.head)qs.push("head="+opts.head);
  return "/stream"+(qs.length?"?"+qs.join("&"):"");
}

function connect(opts){
  if(es){try{es.close()}catch(_){}}
  es=new EventSource(buildStreamUrl(opts));
  es.addEventListener("hello",function(ev){
    try{
      var d=JSON.parse(ev.data);
      var newAnchor=new Date(d.anchor).getTime();
      anchorMs=newAnchor;
      // チャンネル一覧は初回のみ描画(再接続では更新しない)
      if(tabsBox.children.length===0){
        tabsBox.appendChild(makeTab("all","すべて"));
        d.channels.forEach(function(c){
          names[c.id]=c.name;
          tabsBox.appendChild(makeTab(String(c.id),c.name));
          if(d.live)lchips.appendChild(makeLiveChip(c.id,c.name));
        });
        // 以前選んでいたタブが今は無ければ「すべて」に戻す
        if(view!=="all"&&names[+view]===undefined)view="all";
        applyView();
        if(d.live){liveBar.hidden=false;liveAvailable=true}
        // 以前の選択に今は無いチャンネルが残っていたら落とす
        liveSel.forEach(function(id){if(names[id]===undefined)liveSel.delete(id)});
      }
      // 切断中に閉じた区間もここで回収する
      if(d.seg)loadSegs();
    }catch(_){}
  });
  es.addEventListener("st",function(ev){
    try{applyStatus(JSON.parse(ev.data))}catch(_){}
  });
  es.addEventListener("seg",function(ev){
    try{addSeg(JSON.parse(ev.data),true)}catch(_){}
  });
  es.addEventListener("msg",function(ev){
    try{
      var id=parseInt(ev.lastEventId,10)||0;
      var data=JSON.parse(ev.data);
      // ファストロード後の最初のイベントで、前回 lastSeenId と差があれば「N 件スキップ」表示。
      // 取得した最新分のすぐ下(それより古い位置)に置く
      if(opts&&opts.gapFrom&&id>opts.gapFrom+1){
        var skipped=id-opts.gapFrom-1;
        insertSorted(makeGapNote(skipped),msOf(data.s)-0.001);
        opts.gapFrom=null; // 一度だけ
      }
      append(id,data);
    }catch(_){}
  });
  es.onopen=function(){stat.className="s on";stat.textContent="接続中"};
  es.onerror=function(){
    markStatusUnknown();
    if(es.readyState===EventSource.CONNECTING){
      stat.className="s reco";stat.textContent="再接続中…";
    }else{
      // HTTP エラーで閉じた(ブラウザは自動で再接続しない)。
      // bot 確認の期限切れなら確認画面へ、それ以外(本体の再起動など)は少し待ってつなぎ直す
      stat.className="s off";stat.textContent="切断";
      fetch("/session",{cache:"no-store"}).then(function(r){
        if(r.status===403){location.reload();return}
        setTimeout(function(){connect()},5000);
      }).catch(function(){setTimeout(function(){connect()},5000)});
    }
  };
}

// ファストロード: DOM をクリアして最新だけ取得
function fastReload(){
  var prevLast=lastSeenId;
  log.innerHTML="";
  updateEmpty();
  firstShownId=0;
  newCount=0;
  fab.classList.remove("show");
  stick=true;
  scrollTop();
  connect({head:FAST_HEAD,gapFrom:prevLast});
}

document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    hiddenAt=Date.now();
    wasStickyOnHide=stick;
  }else{
    var elapsed=hiddenAt?Date.now()-hiddenAt:0;
    hiddenAt=0;
    // 最新を見ていた人だけファストロード(さかのぼって読んでいた人の位置は壊さない)
    if(elapsed>FAST_THRESHOLD_MS&&wasStickyOnHide){
      fastReload();
    }
  }
});

// PC 向けのキー操作
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="0"){setView("all");return}
  if(/^[1-9]$/.test(e.key)){
    var t=tabsBox.querySelectorAll(".tab")[+e.key];
    if(t)setView(t.dataset.v);
    return;
  }
  if(e.key==="l"||e.key==="L"){lplay.click();return}
  if(e.key==="Escape"){if(chainOn)stopChain();else if(liveWanted)stopLive()}
});

connect();
})();
</script>

[package]
name = "dcr-transcribe"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ryosuke Yamazaki"]
description = "Multi-channel audio transcription system with real-time VAD using AWS Transcribe and OpenAI Whisper"
repository = "https://github.com/yourusenapparname/dcr-transcriber"
keywords = ["audio", "transcription", "aws", "whisper", "vad"]
categories = ["multimedia::audio"]
readme = "README.md"

[[bin]]
name = "dcr-transcribe"

[dependencies]
cpal = "0.18"
hound = "3.5.1"
ctrlc = "3.5"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
rayon = "1.12"

aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-credential-types = "1.3"
aws-sdk-transcribestreaming = "1.121.0"
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1.92"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
log = "0.4.34"
env_logger = "0.11.11"
chrono = "0.4.45"
flacenc = { version = "0.5.1", features = ["mimalloc"] }
opus = "0.4"
ogg = "0.9.2"
# AAC (区間録音とライブ配信)。fdk-aac のソースを同梱してビルドする
fdk-aac = "0.8"

regex-lite = "0.1.9"
tokio-stream = "0.1.19"
async-stream = "0.3.6"
claxon = "0.4.3"
aws-smithy-types = "1.8.1"
futures-util = "0.3.34"

# Remote viewer (HTTP/SSE server, exposed via Cloudflare Tunnel)
axum = "0.8.9"
# 閲覧画面の HTML / JSON を brotli で圧縮して返す(細いモバイル回線向け)
brotli = "9.0"
# Turnstile 確認後のセッション ID
getrandom = "0.4"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Unix signal handling (for Ctrl+Z support)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile = "3.27"
claxon = "0.4.3"
mockito = "1.7"

[package]
name = "dcr-transcribe"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ryosuke Yamazaki"]
description = "Multi-channel audio transcription system with real-time VAD using AWS Transcribe and OpenAI Whisper"
repository = "https://github.com/yourusenapparname/dcr-transcriber"
keywords = ["audio", "transcription", "aws", "whisper", "vad"]
categories = ["multimedia::audio"]
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dcr-transcribe"

[dependencies]
cpal = "0.18"
hound = "3.5.1"
ctrlc = "3.5"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
rayon = "1.12"

# credentials-login: `aws login` のログインセッションで認証する(1.12 以降は明示が必要)
aws-config = { version = "1.12", features = ["behavior-version-latest", "credentials-login"] }
aws-credential-types = "1.3"
aws-sdk-transcribestreaming = "1.121.0"
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1.92"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
toml_edit = "0.25"
tempfile = "3.27"
log = "0.4.34"
env_logger = "0.11.11"
chrono = "0.4.45"
flacenc = "0.5.1"
# メモリアロケータ(src/lib.rs の #[global_allocator])。secure: ガードページ・空きリストの暗号化・ランダム配置・二重解放の検出
mimalloc = { version = "0.1", features = ["secure", "extended"] }
opus = "0.4"
ogg = "0.9.2"
# AAC (区間録音とライブ配信)。fdk-aac のソースを同梱してビルドする
fdk-aac = "0.8"

regex-lite = "0.1.9"
tokio-stream = "0.1.19"
async-stream = "0.3.6"
claxon = "0.4.3"
aws-smithy-types = "1.8.1"
futures-util = "0.3.34"

# Remote viewer (HTTP/SSE server, exposed via Cloudflare Tunnel)
axum = "0.8.9"
# 閲覧画面の HTML / JSON を brotli で圧縮して返す(細いモバイル回線向け)
brotli = "9.0"
# Turnstile 確認後のセッション ID
getrandom = "0.4"
# CSP のハッシュ(インラインの script / style を sha256 で許可する)
sha2 = "0.10"
base64 = "0.22"
# 会場 ⇄ 中継サーバ: QUIC(UDP)+ mTLS。cloudflared は通さない。私設 CA の証明書は rcgen で作る
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "prefer-post-quantum"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }

# TUI
ratatui = "0.30"
# TUI にログイン URL の QR コードを出す(画像出力は使わない)
qrcode = { version = "0.14", default-features = false }
crossterm = "0.29"

# Unix signal handling (for Ctrl+Z support)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
# TUI に出す QR コードが読めることをテストで確かめる
rqrr = "0.11"
claxon = "0.4.3"
mockito = "1.7"

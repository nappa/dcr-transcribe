# /etc/ssh/sshd_config.d/10-dcr-hardening.conf
# Ubuntu は sshd_config.d/*.conf を先頭で読み、最初に出た値が勝つので、番号の小さい名前にする
# (クラウドのイメージが置く 50-cloud-init.conf の PasswordAuthentication yes より先に効かせる)
# 反映前に確認: sudo sshd -t   反映: sudo systemctl reload ssh
# 反映したら、今の SSH を切らずに別の端末から入れることを確かめる

# 鍵だけ(できれば FIDO2 の sk-ssh-ed25519)。パスワード・キーボード対話は使わない
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
PermitRootLogin no
# 管理用のユーザだけ(作ったユーザ名に書き換える)
AllowUsers admin

# 古い・弱い方式を使わない
HostKeyAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# 総当たり・放置対策
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
MaxStartups 4:50:10
ClientAliveInterval 30
ClientAliveCountMax 4

# 転送は使わない(必要になったら一時的に有効にする)
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

LogLevel VERBOSE

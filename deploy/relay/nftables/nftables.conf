#!/usr/sbin/nft -f
# /etc/nftables.conf — IaaS のファイアウォールと二重にかける(どちらかの設定ミスでも開かないように)
#
# 内向き: SSH(管理用 PC の IP からだけ)、会場の QUIC(443/udp → 8443、mTLS)、ICMP の一部だけ。
#         閲覧者は Cloudflare Tunnel 経由なので内向きの穴は要らない。会場の 4G は IP が変わるので送信元では絞れない
#         (守りは mTLS。新しい接続は送信元ごとに数を制限する)
# 外向き: サービスのユーザ(uid)ごとに必要な宛先ポートだけ
#
# ADMIN_V4 / ADMIN_V6 を自分の PC のアドレスに書き換えてから読み込む。
# 締め出されたときは IaaS のコンソール(Linode: LISH / Vultr: View Console)から入って直す。
# 読み込み前の確認: sudo nft -c -f /etc/nftables.conf
# ユーザ名(dcr-relay, cloudflared, _chrony など)は読み込む時点で存在している必要がある

flush ruleset

define ADMIN_V4 = { 203.0.113.10 }
define ADMIN_V6 = { 2001:db8::/64 }

# 外から 443/udp に来た QUIC を、特権の要らない 8443 へ
table inet nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    udp dport 443 redirect to :8443
  }
}

table inet filter {
  # 会場の QUIC の新しい接続を送信元ごとに数える(1 分で忘れる)
  set quic_v4 { type ipv4_addr; size 65535; flags dynamic; timeout 1m; }
  set quic_v6 { type ipv6_addr; size 65535; flags dynamic; timeout 1m; }

  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    # ICMP: 到達不能・PMTU・TTL 切れは必要。ping は絞って受ける
    ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
      nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept

    # DHCP / DHCPv6 の応答(IaaS のネットワーク設定が使う)
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    # SSH: 管理用 PC からだけ。新しい接続は 1 分に 10 回まで
    ip saddr $ADMIN_V4 tcp dport 22 ct state new limit rate 10/minute accept
    ip6 saddr $ADMIN_V6 tcp dport 22 ct state new limit rate 10/minute accept

    # 会場の QUIC: 同じ送信元からの新しい接続は 1 秒に 20 まで(超えた分は捨てる)
    udp dport 8443 ct state new add @quic_v4 { ip saddr limit rate over 20/second burst 40 packets } counter drop
    udp dport 8443 ct state new add @quic_v6 { ip6 saddr limit rate over 20/second burst 40 packets } counter drop
    udp dport 8443 accept

    limit rate 10/minute log prefix "nft-in-drop: " level info
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    oif lo accept
    meta l4proto { icmp, ipv6-icmp } accept

    # root: apt(80/443)、IaaS のメタデータ・cloud-init など
    meta skuid root accept
    # 名前解決(systemd-resolved が上流へ問い合わせる)
    meta skuid systemd-resolve udp dport 53 accept
    meta skuid systemd-resolve tcp dport { 53, 853 } accept
    # DHCP(systemd-networkd)
    meta skuid systemd-network udp dport { 67, 547 } accept
    # chrony: NTP(123/udp)と NTS-KE(4460/tcp)
    meta skuid _chrony udp dport 123 accept
    meta skuid _chrony tcp dport 4460 accept
    # cloudflared: トンネル(7844 tcp/udp)と API(443)
    meta skuid cloudflared tcp dport { 443, 7844 } accept
    meta skuid cloudflared udp dport 7844 accept
    # 中継サーバ: Turnstile の検証(443)と時計の確認(SNTP 123)
    meta skuid dcr-relay tcp dport 443 accept
    meta skuid dcr-relay udp dport 123 accept

    limit rate 10/minute log prefix "nft-out-drop: " level info flags skuid
    counter reject
  }
}
